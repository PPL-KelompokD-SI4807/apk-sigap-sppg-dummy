; SiGAP SPPG - pengaturan PHP produksi (ditimpakan di atas php.ini-production).
; Dipakai image `app` (php-fpm, queue, scheduler).

; --- Penyingkapan & galat ---
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL & ~E_DEPRECATED
; Argumen fungsi tidak masuk jejak tumpukan (token, kata sandi, NIK tidak bocor ke log).
zend.exception_ignore_args = On
zend.assertions = -1

; --- Sumber daya ---
; GD 30 MP (config/unggahan.php maks_piksel) ~120 MB + overhead framework.
memory_limit = 192M
max_execution_time = 60
max_input_time = 30
max_input_vars = 2000

; --- Unggahan (config/unggahan.php maks_byte = 5 MiB; nginx client_max_body_size 6m) ---
file_uploads = On
upload_max_filesize = 5M
post_max_size = 6M
max_file_uploads = 10

; --- OPcache (kode tidak berubah di dalam image) ---
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 64
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 20000
opcache.save_comments = 1
opcache.jit = disable

realpath_cache_size = 4096K
realpath_cache_ttl = 600

; TODO(R01-I24): pertimbangkan disable_functions (exec, shell_exec, system, passthru, popen; proc_open dipakai
; artisan/Symfony Process sehingga perlu diuji), open_basedir=/var/www/html:/tmp, dan allow_url_fopen=Off
; (HTTP keluar memakai Guzzle/curl). Belum diaktifkan karena butuh uji regresi di staging.

; --- Sesi (Laravel memakai driver database; ini hanya cadangan) ---
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax
