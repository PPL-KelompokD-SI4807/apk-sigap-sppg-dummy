; SiGAP SPPG - pool php-fpm produksi (disalin ke /usr/local/etc/php-fpm.d/zzz-sigap.conf,
; dibaca setelah www.conf dan zz-docker.conf bawaan image sehingga nilai di sini yang berlaku).
; Anggaran memori kontainer app 448m: 4 anak x ~40-120 MB tipikal (memory_limit 192M = plafon per anak).

[global]
log_level = notice
emergency_restart_threshold = 5
emergency_restart_interval = 1m
process_control_timeout = 20s

[www]
; listen = 9000 diwarisi dari zz-docker.conf (hanya terjangkau dari jaringan compose `edge`).
pm = ondemand
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.process_idle_timeout = 20s
pm.max_requests = 500
; Batas keras per permintaan; endpoint AI dibatasi agent.time_budget_seconds (25 s). nginx fastcgi_read_timeout 90s.
request_terminate_timeout = 90s

; Health check lokal (docker/php/healthcheck.sh). nginx selalu mengirim SCRIPT_NAME=/index.php,
; jadi jalur ini tidak dapat dijangkau dari luar.
ping.path = /fpm-ping
ping.response = pong

; Produksi (PHP_FPM_CLEAR_ENV=yes dari docker-compose.prod.yml): worker TIDAK mewarisi variabel lingkungan
; (rahasia .env); Laravel membaca config yang di-cache entrypoint (kontainer gagal mulai bila cache gagal).
; Pengembangan (bawaan image `no`): tanpa cache config, worker butuh variabel dari env_file.
clear_env = ${PHP_FPM_CLEAR_ENV}

catch_workers_output = yes
decorate_workers_output = no
; Log akses sudah dicatat nginx (tanpa query string).
access.log = /dev/null

security.limit_extensions = .php
