# SiGAP SPPG - header Mini App (/miniapp/). TANPA X-Frame-Options: Telegram Web (web.telegram.org) membingkai
# Mini App dalam iframe; pembingkai dibatasi lewat CSP frame-ancestors.
# geolocation=(self): modul bukti distribusi memakai navigator.geolocation.
# CSP bertahap: kebijakan minimal DITEGAKKAN (frame-ancestors tidak berlaku dalam mode Report-Only), kebijakan
# lengkap dikirim sebagai Report-Only. Setelah uji staging (Telegram Web/Android/iOS/Desktop) tanpa pelanggaran
# di konsol, pindahkan kebijakan lengkap ke Content-Security-Policy.
# style-src 'unsafe-inline' diperlukan karena komponen memakai atribut style (lebar progress, warna avatar).
add_header Strict-Transport-Security $sigap_hsts always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=(), usb=()" always;
add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://webk.telegram.org https://webz.telegram.org; object-src 'none'; base-uri 'self'" always;
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'" always;
