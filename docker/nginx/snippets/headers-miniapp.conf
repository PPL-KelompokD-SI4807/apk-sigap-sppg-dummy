# SiGAP SPPG - header Mini App (/miniapp/). TANPA X-Frame-Options: Telegram Web (web.telegram.org) membingkai
# Mini App dalam iframe; pembingkai dibatasi lewat CSP frame-ancestors.
# Token login penuh disimpan di localStorage, sehingga pertahanan XSS (eksekusi skrip) ditegakkan.
#
# CSP dua lapis (kedua header berlaku bersamaan; hasil akhir = irisan keduanya untuk yang ditegakkan):
#  1. DITEGAKKAN: script-src 'self' https://telegram.org/js/telegram-web-app.js (skrip asal sendiri + SATU berkas
#     itu, bukan seluruh host telegram.org; tanpa inline/eval), object-src 'none', base-uri 'self', form-action
#     'self', frame-ancestors Telegram. Diaudit: index.html hasil build Vite hanya memuat <script type=module src>
#     + telegram-web-app.js; bundel tidak memakai eval/new Function; Chart.js dimuat sebagai chunk 'self'.
#     Bila URL skrip Telegram di resources/miniapp/index.html berubah (mis. diberi ?versi), samakan di sini.
#  2. Report-Only: kebijakan lengkap (default-src, style, img, connect, ...). Pelanggaran hanya muncul di konsol
#     (tidak ada report-uri). Pindahkan ke mode tegak setelah TG-13 (docs/ops/uji-staging.md) lulus di 4 klien.
# style-src 'unsafe-inline' WAJIB dipertahankan, jangan diketatkan: telegram-web-app.js menyuntik elemen <style>
#   (set_custom_style dari web.telegram.org) dan komponen juga memakai atribut style (lebar progress, warna avatar).
#   Tanpa 'unsafe-inline', gaya dari Telegram diblokir.
# img-src blob:/data: untuk pratinjau foto (URL.createObjectURL) dan lampiran privat yang diambil lewat fetch + blob.
# connect-src 'self': seluruh panggilan API same-origin (/api/v1/...).
# Referrer-Policy no-referrer: Mini App tidak membutuhkan Referer; Origin pada fetch same-origin tetap dikirim.
# Permissions-Policy: camera=(self) dan geolocation=(self) (foto bukti dan lokasi pengiriman); microphone dst. ditutup.
add_header Strict-Transport-Security $sigap_hsts always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self), payment=(), usb=()" always;
add_header Content-Security-Policy "script-src 'self' https://telegram.org/js/telegram-web-app.js; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self' https://web.telegram.org https://webk.telegram.org https://webz.telegram.org" always;
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://telegram.org/js/telegram-web-app.js; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
