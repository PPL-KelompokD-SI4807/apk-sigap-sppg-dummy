# SiGAP SPPG - header keamanan untuk halaman web Laravel (/, rute non-API). add_header di sebuah location
# menimpa header tingkat server, jadi setiap location meng-include satu snippet header lengkap.
add_header Strict-Transport-Security $sigap_hsts always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
