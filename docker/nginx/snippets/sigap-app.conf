# SiGAP SPPG - lokasi aplikasi (di-include server :443 produksi dan server pengembangan).
root /var/www/html/public;
index index.html;

# Berkas tersembunyi (.env, .git, .htaccess, ...) kecuali .well-known.
location ~ /\.(?!well-known/) {
    return 404;
}

# Skrip .php selain front controller tidak pernah diteruskan ke PHP-FPM (lokasi PHP memakai SCRIPT_FILENAME tetap).
location ~* \.php$ {
    return 404;
}

location ~* ^/(storage|vendor|bootstrap|config|database|resources|routes|tests)/ {
    return 404;
}

# Health check Laravel (bootstrap/app.php health: '/up').
location = /up {
    access_log off;
    include /etc/nginx/snippets/headers-api.conf;
    include /etc/nginx/snippets/sigap-php.conf;
}

# Webhook Bot Telegram: CIDR Telegram (TELEGRAM_WEBHOOK_IP_FILTER) + rate limit longgar (seluruh update datang
# dari sedikit IP Telegram; throttle Laravel 600/menit per IP). Secret token diverifikasi Laravel.
# Awalan (^~), bukan pencocokan persis: varian jalur seperti /webhook/ atau //webhook yang dinormalkan Laravel
# ke rute yang sama tetap melewati saringan CIDR dan zona ini.
location ^~ /api/v1/telegram/ {
    if ($sigap_tg_tolak) {
        return 403;
    }
    limit_req zone=sigap_tg burst=200 nodelay;
    # config/telegram.php webhook_max_body = 256 KiB
    client_max_body_size 256k;
    include /etc/nginx/snippets/headers-api.conf;
    include /etc/nginx/snippets/sigap-php.conf;
}

# Login/pra-login (auth/telegram, auth/masuk, ...): batas per IP lebih ketat; tanpa gzip (respons memuat token).
location ^~ /api/v1/auth {
    limit_req zone=sigap_auth burst=10 nodelay;
    limit_req zone=sigap_api burst=40 nodelay;
    gzip off;
    include /etc/nginx/snippets/headers-api.conf;
    include /etc/nginx/snippets/sigap-php.conf;
}

location ^~ /api/ {
    limit_req zone=sigap_api burst=40 nodelay;
    include /etc/nginx/snippets/headers-api.conf;
    include /etc/nginx/snippets/sigap-php.conf;
}

# Mini App (hasil build Vite di public/miniapp, base /miniapp/).
location = /miniapp {
    return 301 /miniapp/;
}

location ^~ /miniapp/assets/ {
    access_log off;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/snippets/headers-static.conf;
}

location ^~ /miniapp/ {
    try_files $uri /miniapp/index.html;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/headers-miniapp.conf;
}

location = /favicon.ico {
    access_log off;
    log_not_found off;
    try_files $uri =404;
    include /etc/nginx/snippets/headers-static.conf;
}

location = /robots.txt {
    access_log off;
    log_not_found off;
    try_files $uri =404;
    include /etc/nginx/snippets/headers-static.conf;
}

# Rute web Laravel lainnya. "/" langsung ke PHP (try_files akan menganggapnya direktori public/).
location = / {
    limit_req zone=sigap_api burst=40 nodelay;
    include /etc/nginx/snippets/headers-web.conf;
    include /etc/nginx/snippets/sigap-php.conf;
}

location / {
    try_files $uri @laravel;
    include /etc/nginx/snippets/headers-web.conf;
}

location @laravel {
    limit_req zone=sigap_api burst=40 nodelay;
    include /etc/nginx/snippets/headers-web.conf;
    include /etc/nginx/snippets/sigap-php.conf;
}
