# Webhook Bot Telegram: CIDR Telegram (TELEGRAM_WEBHOOK_IP_FILTER) + rate limit longgar (seluruh update datang
# dari sedikit IP Telegram; throttle Laravel 600/menit per IP). Secret token diverifikasi Laravel.
# Awalan (^~), bukan pencocokan persis: varian jalur seperti /webhook/ atau //webhook yang dinormalkan Laravel
# ke rute yang sama tetap melewati saringan CIDR dan zona ini.
location ^~ /api/v1/telegram/ {
    if ($sigap_tg_tolak) {
        return 403;
    }
    limit_req zone=sigap_tg burst=200 nodelay;
    # config/telegram.php webhook_max_body = 256 KiB
    client_max_body_size 256k;
    include /etc/nginx/snippets/headers-api.conf;
    include /etc/nginx/snippets/sigap-php.conf;
}

# Login web pra-login (R04-2/R04-4): zona login yang sama dengan /api/v1/auth (per IP), tanpa gzip.
location ^~ /api/v1/web/auth/ {
    limit_req zone=sigap_auth burst=10 nodelay;
    limit_req zone=sigap_api burst=40 nodelay;
    gzip off;
    include /etc/nginx/snippets/headers-api.conf;
    include /etc/nginx/snippets/sigap-php.conf;
}

location = /favicon.ico {
    access_log off;
    log_not_found off;
    try_files $uri =404;
    include /etc/nginx/snippets/headers-static.conf;
}

location = /robots.txt {
    access_log off;
    log_not_found off;
    try_files $uri =404;
    include /etc/nginx/snippets/headers-static.conf;
}

# Klien web (hasil build Vite di public/web, base /web/, rute hash). "/" dilayani dari /web/index.html lewat
# rewrite internal (alamat di browser tetap "/"); header dan cache ditetapkan oleh location /web/ di bawah.
# Tanpa direktif tingkat http (mis. keepalive) di sini (bentrok dengan nginx.conf bawaan, PR #46).
location = / {
    rewrite ^ /web/index.html last;
}

location = /web {
    return 301 /web/;
}

location ^~ /web/assets/ {
    access_log off;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/snippets/headers-webapp.conf;
}

location ^~ /web/ {
    try_files $uri $uri/index.html =404;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/headers-webapp.conf;
}

# Rute web Laravel lainnya (rute "/" Laravel sudah dipensiunkan).
location / {
    try_files $uri @laravel;
    include /etc/nginx/snippets/headers-web.conf;
}

location @laravel {
    limit_req zone=sigap_api burst=40 nodelay;
    include /etc/nginx/snippets/headers-web.conf;
    include /etc/nginx/snippets/sigap-php.conf;
}
