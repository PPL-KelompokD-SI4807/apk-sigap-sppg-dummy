# SiGAP SPPG - header klien web ("/" dan /web/). Sesi web memakai cookie HttpOnly (tanpa token di JS), tetapi XSS
# tetap menunggangi sesi, jadi CSP DITEGAKKAN penuh (ADR 2026-11-09-akses-web, Keputusan 9):
#  - script-src 'self' tanpa telegram.org: klien web tidak memuat telegram-web-app.js.
#  - frame-ancestors 'none' (+ X-Frame-Options DENY): halaman web tidak boleh dibingkai (Mini App memakai snippet lain).
#  - style-src 'self': tanpa 'unsafe-inline'. Satu-satunya pelonggaran yang diizinkan ADR bila uji staging
#    menemukan atribut style inline adalah style-src 'self' 'unsafe-inline'; script-src TIDAK boleh dilonggarkan.
#  - Trusted Types hanya Report-Only (pelanggaran tampil di konsol, tidak memblokir).
# add_header di sebuah location menimpa header tingkat atas, jadi snippet ini di-include di setiap location web.
add_header Strict-Transport-Security $sigap_hsts always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; frame-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'none'; form-action 'self'; upgrade-insecure-requests" always;
add_header Content-Security-Policy-Report-Only "require-trusted-types-for 'script'" always;
