# SiGAP SPPG - header keamanan /api/*. Header yang juga dipasang ApiSecurityHeaders (Laravel) disembunyikan
# dari respons PHP lalu dipasang nginx sekali, sehingga tidak ganda dan tetap ada pada galat nginx (413/429/502).
# Cache-Control no-store untuk /api/v1/auth/* tetap berasal dari Laravel.
fastcgi_hide_header X-Content-Type-Options;
fastcgi_hide_header X-Frame-Options;
fastcgi_hide_header Referrer-Policy;
add_header Strict-Transport-Security $sigap_hsts always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
