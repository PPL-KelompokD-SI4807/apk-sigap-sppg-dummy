schemas:
  SppgAktifError:
    type: object
    required: [message, alasan]
    description: |
      Galat SPPG aktif (R-06a). `sppg_aktif_ditolak` (403): header X-SPPG-Id berisi SPPG yang
      bukan milik investor / bukan SPPG pengguna / format salah — hapus pilihan tersimpan lalu ulangi
      tanpa header atau pilih ulang dari GET /sppg-saya. `sppg_aktif_belum_dipilih` (409): investor
      dengan >1 SPPG belum mengirim header. `tanpa_sppg` (403): investor belum memiliki SPPG.
    properties:
      message: { type: string }
      alasan: { type: string, enum: [sppg_aktif_ditolak, sppg_aktif_belum_dipilih, tanpa_sppg] }
      header: { type: string, const: X-SPPG-Id }
      langkah: { type: string, const: pilih_sppg, description: 'Hanya pada sppg_aktif_belum_dipilih.' }
  SppgPilihan:
    type: object
    required: [id, kode, nama, status_operasional]
    properties:
      id: { type: integer, examples: [3] }
      kode: { type: string, examples: ['SPPG-DEMO-01'] }
      nama: { type: string, examples: ['SPPG Melati Demo'] }
      status_operasional: { type: string, enum: [aktif, libur, nonaktif] }
  KepemilikanSppg:
    type: object
    required: [user_id, role, sppg]
    properties:
      user_id: { type: integer, examples: [41] }
      role: { $ref: '#/components/schemas/Role' }
      sppg:
        type: array
        items:
          type: object
          required: [id, kode, nama]
          properties:
            id: { type: integer }
            kode: { type: string }
            nama: { type: string }
  PenerimaManfaatAgregat:
    type: object
    required: [sppg_id, total, total_penanda, aktif, aktif_penanda, penyamaran, per_kelompok_sasaran, per_titik_layanan]
    description: |
      Hanya hitungan. Tidak pernah memuat nama, kelas, catatan alergi, atau ID penerima, dan tidak pernah
      menyilangkan titik layanan x kelompok sasaran.
      Penyamaran sel kecil (R06a-S-02, docs/decisions/2026-10-26-ambang-agregat-k5.md) berlaku untuk peran
      yang hanya punya hak agregat (investor): hitungan 1..k-1 (k = 5) menjadi `null` + `penanda: "<5"`,
      termasuk sel pelengkap agar sel kecil tidak dapat dihitung dari `aktif`/`total`. Jadi "<5" berarti
      "disamarkan", bukan selalu "kurang dari 5". Nol tetap 0, kecuali bila `aktif` sendiri < k (seluruh
      rincian disamarkan). Peran ber-hak R penuh (Admin, Kepala SPPG, Ahli Gizi): angka asli, penanda null.
    properties:
      sppg_id: { type: integer }
      total: { type: [integer, 'null'], description: 'Seluruh penerima terdaftar (aktif + nonaktif, tanpa yang dihapus). null bila disamarkan.' }
      total_penanda: { type: [string, 'null'], examples: ['<5'] }
      aktif: { type: [integer, 'null'], description: 'null bila disamarkan.' }
      aktif_penanda: { type: [string, 'null'], examples: ['<5'] }
      penyamaran:
        type: object
        required: [diterapkan, ambang_k, penanda]
        properties:
          diterapkan: { type: boolean }
          ambang_k: { type: [integer, 'null'], examples: [5] }
          penanda: { type: [string, 'null'], examples: ['<5'] }
      per_kelompok_sasaran:
        type: array
        description: Selalu memuat keempat kelompok (jumlah 0 bila kosong); hanya penerima aktif.
        items:
          type: object
          required: [kelompok_sasaran, label, jumlah, penanda]
          properties:
            kelompok_sasaran: { type: string, enum: [siswa, balita, ibu_hamil, ibu_menyusui] }
            label: { type: string }
            jumlah: { type: [integer, 'null'] }
            penanda: { type: [string, 'null'], description: 'Terisi ("<5") bila jumlah disamarkan.' }
      per_titik_layanan:
        type: array
        description: Hanya titik layanan (belum dihapus) yang memiliki penerima aktif. Nama titik boleh dilihat investor.
        items:
          type: object
          required: [titik_layanan_id, nama, jumlah, penanda]
          properties:
            titik_layanan_id: { type: integer }
            nama: { type: string }
            jumlah: { type: [integer, 'null'] }
            penanda: { type: [string, 'null'] }
parameters:
  SppgAktif:
    name: X-SPPG-Id
    in: header
    required: false
    description: |
      SPPG aktif (R-06a), divalidasi server di setiap permintaan login penuh. Investor: wajib bila
      memiliki >1 SPPG dan harus SPPG miliknya. Peran lain: opsional, harus sama dengan SPPG sendiri.
      Admin: diabaikan. Format: bilangan bulat positif tanpa nol di depan, maks. 17 digit; selain itu
      403 `sppg_aktif_ditolak` (dicatat log `sppg_aktif.ditolak`). Header dievaluasi SETELAH pemeriksaan
      akun aktif dan ability token: token pra-login selalu mendapat 403 `perlu_login_penuh` apa pun headernya.
    schema: { type: integer, minimum: 1, maximum: 99999999999999999 }
responses:
  SppgAktifDitolak:
    description: Header X-SPPG-Id tidak boleh diakses (`sppg_aktif_ditolak`) atau investor tanpa SPPG (`tanpa_sppg`).
    content:
      application/json:
        schema: { $ref: '#/components/schemas/SppgAktifError' }
        example: { message: 'SPPG yang dipilih tidak dapat Anda akses. Pilih ulang SPPG aktif.', alasan: sppg_aktif_ditolak, header: X-SPPG-Id }
  SppgAktifBelumDipilih:
    description: Investor dengan lebih dari satu SPPG belum mengirim header X-SPPG-Id.
    content:
      application/json:
        schema: { $ref: '#/components/schemas/SppgAktifError' }
        example: { message: 'Pilih SPPG aktif terlebih dahulu.', alasan: sppg_aktif_belum_dipilih, header: X-SPPG-Id, langkah: pilih_sppg }
