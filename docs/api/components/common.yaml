securitySchemes:
  bearerAuth:
    type: http
    scheme: bearer
    description: |
      Token Sanctum. Rute data wajib token LOGIN PENUH (ability auth:penuh) dari
      POST /auth/masuk atau /auth/token/verifikasi; tidak kedaluwarsa, berakhir hanya karena logout
      atau pencabutan. Token pra-login dari POST /auth/telegram hanya untuk rute /auth/masuk,
      /auth/aktivasi, /auth/lupa-password*, /auth/token/*.
schemas:
  Error:
    type: object
    required: [message]
    properties:
      message:
        type: string
        examples: ['Anda tidak memiliki hak akses untuk tindakan ini.']
  ValidationError:
    type: object
    required: [message, errors]
    properties:
      message:
        type: string
        examples: ['Data yang dikirim tidak valid.']
      errors:
        type: object
        additionalProperties:
          type: array
          items:
            type: string
        examples:
          - init_data: ['init_data wajib diisi (Telegram.WebApp.initData).']
  PaginationLinks:
    type: object
    properties:
      first: { type: [string, 'null'], format: uri }
      last: { type: [string, 'null'], format: uri }
      prev: { type: [string, 'null'], format: uri }
      next: { type: [string, 'null'], format: uri }
  PaginationMeta:
    type: object
    properties:
      current_page: { type: integer }
      from: { type: [integer, 'null'] }
      last_page: { type: integer }
      path: { type: string }
      per_page: { type: integer, maximum: 100 }
      to: { type: [integer, 'null'] }
      total: { type: integer }
      links:
        type: array
        items:
          type: object
          properties:
            url: { type: [string, 'null'] }
            label: { type: string }
            active: { type: boolean }
  Paginated:
    description: |
      Bentuk daftar berpaginasi (Resource::collection($paginator)). Pakai dengan allOf dan
      timpa `data.items` dengan skema modul.
    type: object
    required: [data, links, meta]
    properties:
      data:
        type: array
        items: {}
      links:
        $ref: '#/components/schemas/PaginationLinks'
      meta:
        $ref: '#/components/schemas/PaginationMeta'
  IzinUbahHapus:
    type: object
    required: [ubah, hapus]
    description: |
      Izin PER RECORD untuk pengguna login (hasil Policy yang sama dengan endpoint; lihat docs/api/peta-hak.md).
      DEFINISI SERAGAM semua `izin`: HAK (Policy) DAN syarat keadaan yang dapat dibaca dari atribut record tanpa query
      tambahan. `ubah` = PATCH/PUT diizinkan (relawan: hanya record buatannya sendiri pada hari yang sama); `hapus` =
      DELETE diizinkan; untuk jadwal produksi hanya status direncanakan/dibatalkan, untuk jadwal distribusi hanya
      menunggu/siap/dibatalkan. Syarat relasional yang butuh query (jadwal sudah punya log/distribusi aktif/bukti
      distribusi) TIDAK termasuk dan tetap ditegakkan service (422), jadi `hapus=true` masih dapat berujung 422.
      Klien yang tidak menerima `izin` menyembunyikan tombol aksi.
    properties:
      ubah: { type: boolean }
      hapus: { type: boolean }
  IzinJadwalDistribusi:
    type: object
    required: [ubah, hapus, catat_bukti]
    description: |
      Izin per jadwal distribusi. `ubah`/`hapus` = lihat IzinUbahHapus. `catat_bukti` = pengguna boleh `POST /bukti-distribusi`
      untuk jadwal ini, dihitung dengan aturan SAMA dengan penegakan POST (`AturanCatatBukti`): hak Policy create bukti di
      SPPG jadwal; relawan: jadwal tidak ditugaskan kepada petugas lain (`petugas_id` kosong atau dirinya) dan
      `tanggal_distribusi` = hari ini (WIB); status bukan `menunggu`/`dibatalkan`; gerbang mutu batch produksi Layak
      (dibaca dari relasi yang sudah dimuat, tanpa query per baris; relasi tak dimuat = false, gagal tertutup). `true` = POST bukan 403 (bukan jaminan sukses: jadwal
      yang sudah punya bukti tetap 422); `false` = POST ditolak (403/422). Klien memakainya untuk memfilter dropdown jadwal
      pada form Bukti Distribusi.
    properties:
      ubah: { type: boolean }
      hapus: { type: boolean }
      catat_bukti: { type: boolean }
  IzinPembelianBahan:
    type: object
    required: [ubah, hapus, lampirkan, verifikasi]
    description: |
      Izin per pembelian bahan (hak + keadaan atribut). `ubah` dan `lampirkan` false untuk pembelian `terverifikasi` (final); `hapus` selalu
      false (tidak ada hapus); `verifikasi` true hanya untuk akuntan SPPG yang sama, BUKAN pencatat pembelian itu, dan
      status `diajukan`.
    properties:
      ubah: { type: boolean }
      hapus: { type: boolean }
      lampirkan: { type: boolean, description: 'POST /lampiran (nota) ke pembelian ini diizinkan.' }
      verifikasi: { type: boolean, description: 'POST /pembelian-bahan/{id}/verifikasi diizinkan (hak keputusan).' }
  IzinPengeluaran:
    type: object
    required: [ubah, hapus, lampirkan, putuskan]
    description: |
      Izin per pengeluaran. `ubah`/`hapus`/`lampirkan` false untuk pengeluaran hasil verifikasi pembelian
      (`pembelian_bahan_id` terisi); `lampirkan` juga false saat status `disetujui`; `putuskan` true hanya untuk investor pemilik SPPG aktif pada status
      `diajukan` (hak keputusan, bukan hak tulis; investor tetap `baca_saja`).
    properties:
      ubah: { type: boolean }
      hapus: { type: boolean }
      lampirkan: { type: boolean }
      putuskan: { type: boolean, description: 'POST /keuangan/pengeluaran/{id}/keputusan diizinkan.' }
  IzinPerjalanan:
    type: object
    required: [ubah_status]
    description: |
      Izin per notifikasi perjalanan. `ubah_status` = POST /notifikasi-perjalanan/{id}/status diizinkan (hak C modul,
      SPPG sama, relawan hanya perjalanan yang ia picu) DAN perjalanan belum final (tiba/dibatalkan = false).
    properties:
      ubah_status: { type: boolean }
parameters:
  Page:
    name: page
    in: query
    schema: { type: integer, minimum: 1, default: 1 }
  PerPage:
    name: per_page
    in: query
    description: Jumlah per halaman (maks 100).
    schema: { type: integer, minimum: 1, maximum: 100, default: 15 }
  Search:
    name: q
    in: query
    description: Kata kunci pencarian (maks 100 karakter).
    schema: { type: string, maxLength: 100 }
  DateFrom:
    name: from
    in: query
    schema: { type: string, format: date }
  DateTo:
    name: to
    in: query
    schema: { type: string, format: date }
responses:
  Unauthorized:
    description: Token tidak ada/kedaluwarsa/dicabut, atau initData tidak sah.
    content:
      application/json:
        schema: { $ref: '#/components/schemas/Error' }
        example: { message: 'Tidak terautentikasi. Silakan buka ulang Mini App.' }
  Forbidden:
    description: |
      Peran tidak memiliki hak (Tabel 5), akun nonaktif, atau token bukan login penuh
      (body berisi `alasan: perlu_login_penuh`, lihat AuthForbidden).
    content:
      application/json:
        schema: { $ref: '#/components/schemas/Error' }
        example: { message: 'Anda tidak memiliki hak akses untuk tindakan ini.' }
  NotFound:
    description: Data tidak ada atau milik SPPG lain.
    content:
      application/json:
        schema: { $ref: '#/components/schemas/Error' }
        example: { message: 'Data tidak ditemukan.' }
  ValidationFailed:
    description: Validasi Form Request gagal.
    content:
      application/json:
        schema: { $ref: '#/components/schemas/ValidationError' }
  TooManyRequests:
    description: Batas laju terlampaui (API 60/menit per pengguna; login 10/menit per IP).
    headers:
      Retry-After:
        schema: { type: integer }
    content:
      application/json:
        schema: { $ref: '#/components/schemas/Error' }
        example: { message: 'Terlalu banyak permintaan. Coba lagi sebentar lagi.' }
  ServerError:
    description: Galat internal (detail tidak pernah dikirim di production).
    content:
      application/json:
        schema: { $ref: '#/components/schemas/Error' }
        example: { message: 'Terjadi kesalahan pada server.' }
