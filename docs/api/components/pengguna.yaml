schemas:
  Pengguna:
    type: object
    properties:
      id: { type: integer }
      name: { type: string }
      role: { $ref: '#/components/schemas/Role' }
      role_label: { type: string }
      unit: { $ref: '#/components/schemas/RelawanUnit' }
      sppg_id: { type: [integer, 'null'] }
      sppg_nama: { type: string, description: 'Ada bila relasi dimuat (daftar/detail).' }
      phone: { type: [string, 'null'] }
      telegram_username: { type: [string, 'null'] }
      telegram_terhubung: { type: boolean }
      is_active: { type: boolean }
      status: { type: string, enum: [aktif, nonaktif, menunggu_telegram] }
      last_login_at: { type: [string, 'null'], format: date-time }
      created_at: { type: string, format: date-time }
    example:
      id: 12
      name: Siti Rahayu
      role: relawan
      role_label: Relawan
      unit: dapur
      sppg_id: 1
      sppg_nama: SPPG Melati Demo
      phone: '0812-0000-1234'
      telegram_username: null
      telegram_terhubung: false
      is_active: true
      status: menunggu_telegram
      last_login_at: null
      created_at: '2026-10-26T08:00:00+07:00'
  PenggunaInput:
    type: object
    required: [name, role]
    properties:
      name: { type: string, maxLength: 120 }
      role: { $ref: '#/components/schemas/Role' }
      unit: { type: [string, 'null'], enum: [dapur, distribusi, null], description: 'Wajib untuk relawan; harus kosong untuk peran lain.' }
      sppg_id: { type: [integer, 'null'], description: 'Wajib untuk non-admin; harus kosong untuk admin.' }
      phone: { type: [string, 'null'], maxLength: 30 }
      is_active: { type: boolean, default: true }
      ai_draft_id: { type: [string, 'null'], format: uuid }
  PenggunaUpdateInput:
    type: object
    properties:
      name: { type: string, maxLength: 120 }
      role: { $ref: '#/components/schemas/Role' }
      unit: { type: [string, 'null'], enum: [dapur, distribusi, null] }
      sppg_id: { type: [integer, 'null'] }
      phone: { type: [string, 'null'], maxLength: 30 }
      is_active: { type: boolean }
      ai_draft_id: { type: [string, 'null'], format: uuid }
  Undangan:
    type: object
    properties:
      id: { type: integer }
      tipe: { type: string, enum: [pengguna, pic] }
      status: { type: string, enum: [aktif, terpakai, kedaluwarsa, dicabut] }
      role: { type: [string, 'null'] }
      unit: { type: [string, 'null'] }
      sppg_id: { type: [integer, 'null'] }
      user_id: { type: [integer, 'null'] }
      user_nama: { type: string, description: 'Ada bila relasi dimuat.' }
      titik_layanan_id: { type: [integer, 'null'] }
      titik_layanan_nama: { type: string, description: 'Ada bila relasi dimuat.' }
      created_by: { type: integer }
      expires_at: { type: string, format: date-time }
      used_at: { type: [string, 'null'], format: date-time }
      revoked_at: { type: [string, 'null'], format: date-time }
      created_at: { type: string, format: date-time }
  UndanganDibuat:
    description: Undangan + token mentah (hanya sekali, tidak dapat diambil ulang).
    allOf:
      - $ref: '#/components/schemas/Undangan'
      - type: object
        properties:
          token: { type: string, description: '43 karakter base64url (32 byte acak).' }
          deep_link: { type: [string, 'null'], description: 'https://t.me/<bot>?start=inv_<token>; null bila TELEGRAM_BOT_USERNAME kosong.' }
    example:
      id: 5
      tipe: pengguna
      status: aktif
      role: relawan
      unit: dapur
      sppg_id: 1
      user_id: 12
      titik_layanan_id: null
      created_by: 1
      expires_at: '2026-10-29T08:00:00+07:00'
      used_at: null
      revoked_at: null
      created_at: '2026-10-26T08:00:00+07:00'
      token: 'q8VxS2mT0b1kJ4n7Yp3Zc9HdWfLrAeUoIgNvBxKtMs0'
      deep_link: 'https://t.me/sigap_sppg_bot?start=inv_q8VxS2mT0b1kJ4n7Yp3Zc9HdWfLrAeUoIgNvBxKtMs0'
  UndanganInput:
    type: object
    properties:
      user_id: { type: integer, description: 'Akun yang sudah ada tanpa Telegram. Tidak boleh bersama role/unit/sppg_id.' }
      role: { $ref: '#/components/schemas/Role' }
      unit: { type: [string, 'null'], enum: [dapur, distribusi, null] }
      sppg_id: { type: [integer, 'null'] }
