schemas:
  Sppg:
    type: object
    properties:
      id: { type: integer }
      kode: { type: string }
      nama: { type: string }
      id_sppg_bgn: { type: [string, 'null'], description: 'R07-1. ID SPPG menurut BGN (Lampiran 30).' }
      alamat: { type: string }
      kecamatan: { type: [string, 'null'] }
      kab_kota: { type: [string, 'null'] }
      provinsi: { type: [string, 'null'] }
      mitra_yayasan: { type: [string, 'null'] }
      telepon: { type: [string, 'null'] }
      kapasitas_porsi_harian: { type: integer, minimum: 1 }
      status_operasional: { type: string, enum: [aktif, libur, nonaktif] }
      created_at: { type: string, format: date-time }
      updated_at: { type: string, format: date-time }
      nama_ketua_yayasan: { type: [string, 'null'], description: 'R07-1. HANYA untuk peran yang boleh membaca modul keuangan (admin, kepala_sppg, akuntan, investor); peran lain: kunci tidak ada.' }
      no_va: { type: [string, 'null'], description: 'R07-1. Rekening/Virtual Account; pembatasan peran sama dengan nama_ketua_yayasan.' }
      saldo_awal: { type: [integer, 'null'], description: 'R07-1. Rupiah bulat; diisi lewat PUT /sppg/{id}/saldo-awal; null = belum diisi. Pembatasan peran sama.' }
      saldo_awal_tanggal: { type: [string, 'null'], format: date }
      pengaturan_anggaran: { $ref: '#/components/schemas/PengaturanAnggaran' }
      pengaturan_anggaran_kustom: { $ref: '#/components/schemas/PengaturanAnggaranKustom' }
      izin:
        type: object
        description: 'Hanya untuk peran pembaca keuangan.'
        properties:
          ubah_saldo_awal: { type: boolean, description: 'true hanya untuk admin dan akuntan SPPG ini.' }
    example:
      id: 1
      kode: SPPG-DEMO-01
      nama: SPPG Melati Demo
      alamat: 'Jl. Contoh Raya No. 1, Kota Contoh'
      mitra_yayasan: Yayasan Demo Sejahtera
      telepon: '0812-0000-1111'
      kapasitas_porsi_harian: 2000
      status_operasional: aktif
      created_at: '2026-10-26T08:00:00+07:00'
      updated_at: '2026-10-26T08:00:00+07:00'
  PengaturanAnggaran:
    type: object
    description: 'Nilai EFEKTIF: kolom kosong diganti nilai bawaan kode (8000 / 10000 / 6000000 / 6).'
    properties:
      acuan_bahan_baku_kecil: { type: integer, examples: [8000], description: 'Rupiah per porsi: Balita, PAUD/TK/RA, SD/MI kelas 1-3.' }
      acuan_bahan_baku_lainnya: { type: integer, examples: [10000], description: 'Rupiah per porsi: kelompok lain (termasuk Food Sample dan Uji Organoleptik).' }
      insentif_fasilitas_per_hari: { type: integer, examples: [6000000] }
      insentif_fasilitas_maks_hari_minggu: { type: integer, examples: [6] }
  PengaturanAnggaranKustom:
    type: object
    description: 'Nilai tersimpan; null = memakai bawaan.'
    properties:
      acuan_bahan_baku_kecil: { type: [integer, 'null'] }
      acuan_bahan_baku_lainnya: { type: [integer, 'null'] }
      insentif_fasilitas_per_hari: { type: [integer, 'null'] }
      insentif_fasilitas_maks_hari_minggu: { type: [integer, 'null'] }
  SaldoAwalInput:
    type: object
    required: [saldo_awal, saldo_awal_tanggal]
    properties:
      saldo_awal: { type: integer, minimum: 0, maximum: 9999999999999, description: 'Rupiah bulat, nol sah.' }
      saldo_awal_tanggal: { type: string, format: date, description: 'Tidak boleh di masa depan.' }
  SppgInput:
    type: object
    required: [kode, nama, alamat, kapasitas_porsi_harian]
    properties:
      kode: { type: string, maxLength: 30, description: 'Hanya Admin; diabaikan bila dikirim Kepala SPPG.' }
      nama: { type: string, maxLength: 255 }
      alamat: { type: string, maxLength: 255 }
      mitra_yayasan: { type: [string, 'null'], maxLength: 255 }
      id_sppg_bgn: { type: [string, 'null'], maxLength: 30, description: 'Huruf, angka, . / _ -' }
      kecamatan: { type: [string, 'null'], maxLength: 100 }
      kab_kota: { type: [string, 'null'], maxLength: 100 }
      provinsi: { type: [string, 'null'], maxLength: 100 }
      nama_ketua_yayasan: { type: [string, 'null'], maxLength: 150, description: 'Tanpa nomor identitas (8+ angka berurutan ditolak).' }
      no_va: { type: [string, 'null'], maxLength: 50, description: 'Angka, spasi, titik, tanda hubung.' }
      acuan_bahan_baku_kecil: { type: [integer, 'null'], minimum: 1, maximum: 1000000, description: 'null = bawaan 8000.' }
      acuan_bahan_baku_lainnya: { type: [integer, 'null'], minimum: 1, maximum: 1000000, description: 'null = bawaan 10000.' }
      insentif_fasilitas_per_hari: { type: [integer, 'null'], minimum: 0, maximum: 1000000000, description: 'null = bawaan 6000000.' }
      insentif_fasilitas_maks_hari_minggu: { type: [integer, 'null'], minimum: 1, maximum: 7, description: 'null = bawaan 6.' }
      telepon: { type: [string, 'null'], maxLength: 30 }
      kapasitas_porsi_harian: { type: integer, minimum: 1, maximum: 100000 }
      status_operasional: { type: string, enum: [aktif, libur, nonaktif], default: aktif }
      ai_draft_id: { type: [string, 'null'], format: uuid }
