/jadwal/{id}/kebutuhan-bahan:
  parameters:
    - { name: id, in: path, required: true, schema: { type: integer } }
  get:
    tags: [Jadwal]
    summary: Estimasi kebutuhan bahan jadwal produksi vs stok
    description: |
      Kebutuhan = Sum(gram_per_porsi x target_porsi) per bahan menu, dikonversi ke satuan stok memakai
      `config('produksi.konversi_gram')` (kg, g, liter, ml). Bahan bersatuan lain (butir, ikat, ...)
      tidak dapat dibandingkan (`dapat_dibandingkan=false`, kekurangan null).
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: object
              properties:
                data: { $ref: '#/components/schemas/KebutuhanBahan' }
      '401': { $ref: '#/components/responses/Unauthorized' }
      '403': { $ref: '#/components/responses/Forbidden' }
      '404': { $ref: '#/components/responses/NotFound' }
