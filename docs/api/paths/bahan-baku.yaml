/bahan-baku:
  get:
    tags: [Bahan Baku]
    summary: Daftar bahan baku (SPPG pengguna; Admin lintas SPPG)
    description: |
      Hak: R (admin, kepala_sppg, ahli_gizi, akuntan, staf_gudang). Filter: `q` (nama/kode),
      `kategori`, `pemasok_id`, `stok_menipis=1`, `sppg_id` (hanya Admin).
    parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      - $ref: '#/components/parameters/Search'
      - { name: kategori, in: query, schema: { $ref: '#/components/schemas/KategoriBahan' } }
      - { name: pemasok_id, in: query, schema: { type: integer } }
      - { name: stok_menipis, in: query, schema: { type: integer, enum: [0, 1] } }
      - { name: sppg_id, in: query, description: 'Hanya dipakai Admin', schema: { type: integer } }
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Paginated'
                - properties:
                    data:
                      type: array
                      items: { $ref: '#/components/schemas/BahanBaku' }
      '401': { $ref: '#/components/responses/Unauthorized' }
      '403': { $ref: '#/components/responses/Forbidden' }
  post:
    tags: [Bahan Baku]
    summary: Tambah bahan baku (stok awal 0; isi lewat mutasi masuk)
    description: |
      Hak: C (admin, staf_gudang). `sppg_id` hanya dipakai Admin (wajib); diabaikan untuk peran lain.
      Menerima `ai_draft_id` opsional (draf Agen AI ditandai confirmed setelah sukses).
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/BahanBakuInput' }
          example: { nama: 'Beras Premium', kode: 'BB-001', kategori: karbohidrat, satuan: kg, stok_minimum: 50, pemasok_id: 3 }
    responses:
      '201':
        description: Dibuat
        content:
          application/json:
            schema:
              type: object
              properties:
                data: { $ref: '#/components/schemas/BahanBaku' }
      '401': { $ref: '#/components/responses/Unauthorized' }
      '403': { $ref: '#/components/responses/Forbidden' }
      '422': { $ref: '#/components/responses/ValidationFailed' }
/bahan-baku/stok-menipis:
  get:
    tags: [Bahan Baku]
    summary: Bahan dengan stok <= stok minimum
    description: Hak R. Diurutkan dari rasio stok/minimum terkecil.
    parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Paginated'
                - properties:
                    data:
                      type: array
                      items: { $ref: '#/components/schemas/BahanBaku' }
      '401': { $ref: '#/components/responses/Unauthorized' }
      '403': { $ref: '#/components/responses/Forbidden' }
/bahan-baku/kedaluwarsa-dekat:
  get:
    tags: [Bahan Baku]
    summary: Bahan (stok > 0) yang kedaluwarsa dalam N hari ke depan atau sudah lewat
    description: Hak R. Ambang default `config('gudang.kedaluwarsa_hari')` = 3 hari.
    parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      - { name: hari, in: query, description: 'Ambang hari (0-365), default 3', schema: { type: integer, minimum: 0, maximum: 365, default: 3 } }
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Paginated'
                - properties:
                    data:
                      type: array
                      items: { $ref: '#/components/schemas/BahanBaku' }
      '401': { $ref: '#/components/responses/Unauthorized' }
      '403': { $ref: '#/components/responses/Forbidden' }
/bahan-baku/{id}:
  parameters:
    - { name: id, in: path, required: true, schema: { type: integer } }
  get:
    tags: [Bahan Baku]
    summary: Detail bahan baku
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: object
              properties:
                data: { $ref: '#/components/schemas/BahanBaku' }
      '401': { $ref: '#/components/responses/Unauthorized' }
      '403': { $ref: '#/components/responses/Forbidden' }
      '404': { $ref: '#/components/responses/NotFound' }
  put:
    tags: [Bahan Baku]
    summary: Ubah bahan baku (stok TIDAK dapat diubah di sini; pakai mutasi)
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/BahanBakuInput' }
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: object
              properties:
                data: { $ref: '#/components/schemas/BahanBaku' }
      '401': { $ref: '#/components/responses/Unauthorized' }
      '403': { $ref: '#/components/responses/Forbidden' }
      '404': { $ref: '#/components/responses/NotFound' }
      '422': { $ref: '#/components/responses/ValidationFailed' }
  patch:
    tags: [Bahan Baku]
    summary: Ubah sebagian bahan baku
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/BahanBakuInput' }
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: object
              properties:
                data: { $ref: '#/components/schemas/BahanBaku' }
      '401': { $ref: '#/components/responses/Unauthorized' }
      '403': { $ref: '#/components/responses/Forbidden' }
      '404': { $ref: '#/components/responses/NotFound' }
      '422': { $ref: '#/components/responses/ValidationFailed' }
  delete:
    tags: [Bahan Baku]
    summary: Hapus lunak bahan baku
    description: Ditolak (422) bila bahan masih dipakai komposisi menu aktif.
    responses:
      '204': { description: Terhapus }
      '401': { $ref: '#/components/responses/Unauthorized' }
      '403': { $ref: '#/components/responses/Forbidden' }
      '404': { $ref: '#/components/responses/NotFound' }
      '422': { $ref: '#/components/responses/ValidationFailed' }
/bahan-baku/{id}/mutasi:
  parameters:
    - { name: id, in: path, required: true, schema: { type: integer } }
  get:
    tags: [Bahan Baku]
    summary: Riwayat mutasi stok bahan
    description: Hak R. Filter `jenis`, `from`/`to` (tanggal_mutasi).
    parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      - { name: jenis, in: query, schema: { $ref: '#/components/schemas/JenisMutasi' } }
      - $ref: '#/components/parameters/DateFrom'
      - $ref: '#/components/parameters/DateTo'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Paginated'
                - properties:
                    data:
                      type: array
                      items: { $ref: '#/components/schemas/MutasiStok' }
      '401': { $ref: '#/components/responses/Unauthorized' }
      '403': { $ref: '#/components/responses/Forbidden' }
      '404': { $ref: '#/components/responses/NotFound' }
  post:
    tags: [Bahan Baku]
    summary: Catat mutasi stok (masuk/keluar/penyesuaian), atomik
    description: |
      Hak U pada bahan baku (admin, staf_gudang). Transaksi + kunci baris bahan; stok tidak boleh
      negatif (422 pada `jumlah`). `masuk`/`keluar`: jumlah > 0. `penyesuaian`: jumlah selisih bertanda
      (boleh negatif, bukan 0) dan `catatan` (alasan) wajib. `keluar` wajib `jadwal_produksi_id` atau
      `catatan`. `pemasok_id` dan `tanggal_kedaluwarsa` hanya untuk `masuk`. Stok per batch dihitung FEFO
      dari mutasi masuk bertanggal kedaluwarsa (lihat /bahan-baku/{id}/batch). Pencatat = pengguna login.
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/MutasiStokInput' }
          examples:
            masuk:
              value: { jenis: masuk, jumlah: 100, pemasok_id: 3, harga_satuan: 14500, tanggal_kedaluwarsa: '2027-01-15', catatan: 'Pengiriman pagi' }
            keluar:
              value: { jenis: keluar, jumlah: 25.5, jadwal_produksi_id: 12 }
            penyesuaian:
              value: { jenis: penyesuaian, jumlah: -2, catatan: 'Susut timbang hasil stok opname' }
    responses:
      '201':
        description: Mutasi tercatat, saldo diperbarui
        content:
          application/json:
            schema:
              type: object
              properties:
                data: { $ref: '#/components/schemas/MutasiStok' }
                bahan_baku: { $ref: '#/components/schemas/BahanBaku' }
      '401': { $ref: '#/components/responses/Unauthorized' }
      '403': { $ref: '#/components/responses/Forbidden' }
      '404': { $ref: '#/components/responses/NotFound' }
      '422': { $ref: '#/components/responses/ValidationFailed' }
/bahan-baku/{id}/batch:
  parameters:
    - { name: id, in: path, required: true, schema: { type: integer } }
  get:
    tags: [Bahan Baku]
    summary: Stok per batch (FEFO: kedaluwarsa terdekat habis lebih dulu)
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: array
                  items: { $ref: '#/components/schemas/BatchStok' }
                stok_tanpa_batch:
                  type: string
                  description: Stok yang tidak terikat batch masuk (stok awal/penyesuaian positif).
      '401': { $ref: '#/components/responses/Unauthorized' }
      '403': { $ref: '#/components/responses/Forbidden' }
      '404': { $ref: '#/components/responses/NotFound' }
