/persetujuan-menu:
  get:
    tags: [Persetujuan Menu]
    summary: Daftar pengajuan menu
    description: 'Hak R: Admin, Kepala SPPG, Ahli Gizi, Investor (SPPG aktif via X-SPPG-Id). Daftar tanpa `rincian`.'
    parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      - { name: status, in: query, schema: { $ref: '#/components/schemas/StatusPengajuanMenu' } }
      - { name: menu_id, in: query, schema: { type: integer } }
      - { name: sppg_id, in: query, description: 'Hanya berpengaruh untuk Admin.', schema: { type: integer } }
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Paginated'
                - properties:
                    data:
                      type: array
                      items: { $ref: '#/components/schemas/PengajuanMenu' }
      '401': { $ref: '#/components/responses/Unauthorized' }
      '403': { $ref: '#/components/responses/Forbidden' }
      '429': { $ref: '#/components/responses/TooManyRequests' }
/persetujuan-menu/{id}:
  parameters:
    - { name: id, in: path, required: true, schema: { type: integer } }
  get:
    tags: [Persetujuan Menu]
    summary: Detail pengajuan menu (snapshot lengkap)
    description: 'Pengajuan SPPG lain atau investor tanpa kepemilikan SPPG tersebut -> 403/404.'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: object
              properties:
                data: { $ref: '#/components/schemas/PengajuanMenu' }
            example:
              data:
                id: 7
                sppg_id: 1
                menu_id: 12
                nama_menu: 'Nasi, Ayam Panggang, Sup Wortel'
                kelompok_sasaran: siswa
                nomor: 1
                menu_versi: 2
                status: diajukan
                status_label: Diajukan
                biaya_per_porsi: 6840
                jumlah_porsi: 500
                sumber_porsi: penerima_manfaat_total
                keterangan_asumsi: 'Jumlah porsi memakai total penerima manfaat aktif.'
                total_biaya: 3420000
                catatan_pengaju: 'Mohon ditinjau.'
                diajukan_oleh: 'Ahli Gizi 1 (Demo)'
                diajukan_pada: '2026-10-26T09:00:00+07:00'
                diputuskan_oleh: null
                diputuskan_pada: null
                catatan_keputusan: null
                menu_versi_sekarang: 2
                kedaluwarsa: false
                rincian:
                  menu: { nama_menu: 'Nasi, Ayam Panggang, Sup Wortel', kelompok_sasaran: siswa, gizi_per_porsi: { energi_kkal: 630, protein_g: 23, lemak_g: 18, karbohidrat_g: 91, serat_g: 8 } }
                  bahan:
                    - { bahan_baku_id: 3, nama: Beras, satuan: kg, gram_per_porsi: 90, gram_per_satuan: 1000, harga_per_satuan: 12500, pemasok_id: 5, pemasok_nama: 'Koperasi Desa Sejahtera (Demo)', pemasok_utama: false, berlaku_mulai: '2026-10-23', biaya_per_porsi: 1125, masalah: null }
                  tanggal_acuan: '2026-10-26'
      '401': { $ref: '#/components/responses/Unauthorized' }
      '403': { $ref: '#/components/responses/Forbidden' }
      '404': { $ref: '#/components/responses/NotFound' }
/persetujuan-menu/{id}/keputusan:
  parameters:
    - { name: id, in: path, required: true, schema: { type: integer } }
  post:
    tags: [Persetujuan Menu]
    summary: Putuskan pengajuan menu (investor)
    description: |
      Hanya Investor pemilik SPPG pengajuan (pivot + `X-SPPG-Id`); peran lain termasuk Admin -> 403.
      Transaksi mengunci menu lalu pengajuan. 409 bila pengajuan sudah diputuskan/dibatalkan, menu berubah,
      atau `versi_menu` tidak sama dengan versi menu di server. Tidak ada endpoint ubah/hapus pengajuan.
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/KeputusanInput' }
          example: { keputusan: perlu_revisi, catatan: 'Turunkan porsi ayam menjadi 50 g.', versi_menu: 2 }
    responses:
      '200':
        description: Diputuskan
        content:
          application/json:
            schema:
              type: object
              properties:
                data: { $ref: '#/components/schemas/PengajuanMenu' }
      '401': { $ref: '#/components/responses/Unauthorized' }
      '403': { $ref: '#/components/responses/Forbidden' }
      '404': { $ref: '#/components/responses/NotFound' }
      '409': { $ref: '#/components/responses/KonflikPersetujuan' }
      '422': { $ref: '#/components/responses/ValidationFailed' }
      '429': { $ref: '#/components/responses/TooManyRequests' }
