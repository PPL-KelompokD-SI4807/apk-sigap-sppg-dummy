/laporan-bgn/bulanan/nomor:
  post:
    tags: [Laporan BGN]
    summary: Terbitkan nomor LPA Lampiran 30d (idempoten)
    description: |
      Menerbitkan nomor LPA `xx/LPA/x/tahun` untuk periode bulanan (30d A dan B satu nomor). IDEMPOTEN per (SPPG, jenis dokumen, periode): panggilan
      ulang mengembalikan nomor yang sama (`baru: false`) tanpa menghabiskan nomor baru. Urutan dua digit per SPPG per
      tahun, dibagi seluruh laporan bernomor. Hak: admin, kepala_sppg, akuntan pada SPPG aktifnya (admin wajib `sppg_id`
      di body); investor, ahli_gizi, staf_gudang, relawan = 403 (dicek sebelum validasi); lintas SPPG = 403. Dicatat di
      audit (`laporan_bgn_nomor_terbit`, hanya terbitan baru, tanpa isi data laporan).
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [bulan]
            properties:
              sppg_id: { type: integer, description: 'WAJIB untuk admin; peran lain opsional dan harus SPPG aktifnya (lain = 403).' }
              bulan: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$', example: '2026-11' }
    responses:
      '200':
        description: Nomor terbit atau sudah pernah terbit
        content:
          application/json:
            schema:
              type: object
              properties:
                data: { $ref: '#/components/schemas/NomorLaporanBgn' }
      '401': { $ref: '#/components/responses/Unauthorized' }
      '403': { $ref: '#/components/responses/Forbidden' }
      '422': { $ref: '#/components/responses/ValidationFailed' }
# 30a dan 30d-C tidak bernomor menurut juknis: tidak ada rute POST nomor (404).
