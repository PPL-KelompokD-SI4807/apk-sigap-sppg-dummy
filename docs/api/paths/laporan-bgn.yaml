    tags: [Laporan BGN]
    summary: Lampiran 30d bagian A - Laporan Bulanan (Summary)
    description: |
      Isi dan angka identik 30c untuk satu bulan kalender. Hak: admin, kepala_sppg, akuntan, investor (agregat).
      Bagian A dan B satu laporan bulanan dengan satu nomor LPA (terbit lewat `POST /laporan-bgn/bulanan/nomor`; GET hanya membaca).
    parameters:
      - $ref: '#/components/parameters/LaporanSppgId'
      - $ref: '#/components/parameters/LaporanAkuntanId'
      - $ref: '#/components/parameters/LaporanKepalaSppgId'
      - $ref: '#/components/parameters/LaporanBulan'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: object
              properties:
                data: { $ref: '#/components/schemas/LaporanBgnRingkasan' }
      '401': { $ref: '#/components/responses/Unauthorized' }
      '403': { $ref: '#/components/responses/Forbidden' }
      '422': { $ref: '#/components/responses/ValidationFailed' }
/laporan-bgn/bulanan/anggaran:
  get:
    tags: [Laporan BGN]
    summary: Lampiran 30d bagian B - Laporan Bulanan (Anggaran)
    description: |
      Tabel `No | Tanggal | Perihal | Dana Masuk | Dana Keluar | Saldo | Keterangan` dengan saldo berjalan; urutan baris:
      Penerimaan Saldo Awal, penerimaan dana (pencairan), "Pembelanjaan:", lalu subkelompok Bahan Baku Pangan, Biaya
      Operasional, Insentif Fasilitas SPPG. `total.saldo_akhir` selalu sama dengan `sisa_anggaran_total` bagian A.
      Hak: admin, kepala_sppg, akuntan, investor (agregat). Untuk investor `perihal` memakai label baku (bukan teks
      bebas uraian) dan `keterangan` pencairan dikosongkan.
    parameters:
      - $ref: '#/components/parameters/LaporanSppgId'
      - $ref: '#/components/parameters/LaporanAkuntanId'
      - $ref: '#/components/parameters/LaporanKepalaSppgId'
      - $ref: '#/components/parameters/LaporanBulan'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: object
              properties:
                data: { $ref: '#/components/schemas/LaporanBgnAnggaran' }
      '401': { $ref: '#/components/responses/Unauthorized' }
      '403': { $ref: '#/components/responses/Forbidden' }
      '422': { $ref: '#/components/responses/ValidationFailed' }
/laporan-bgn/bulanan/penerima-manfaat:
  get:
    tags: [Laporan BGN]
    summary: Lampiran 30d bagian C - Laporan Bulanan (Penerima Manfaat)
    description: |
      Satu baris per hari kalender; 9 kolom peserta didik + 3 kolom non-peserta didik + `belum_terklasifikasi` + total.
      Porsi per kolom adalah ESTIMASI (proporsi penerima aktif per baris sasaran x realisasi porsi harian);
      `total` harian = realisasi porsi. Hak: admin, kepala_sppg, akuntan. INVESTOR = 403 (Q-4). Tidak bernomor.
    parameters:
      - $ref: '#/components/parameters/LaporanSppgId'
      - $ref: '#/components/parameters/LaporanBulan'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: object
              properties:
                data: { $ref: '#/components/schemas/LaporanBgnPenerimaBulanan' }
      '401': { $ref: '#/components/responses/Unauthorized' }
      '403': { $ref: '#/components/responses/Forbidden' }
      '422': { $ref: '#/components/responses/ValidationFailed' }
/laporan-bgn/harian/nomor:
  post:
    tags: [Laporan BGN]
    summary: Terbitkan nomor LPA Lampiran 30b (idempoten)
    description: |
      Menerbitkan nomor LPA `xx/LPA/x/tahun` untuk periode. IDEMPOTEN per (SPPG, jenis dokumen, periode): panggilan
      ulang mengembalikan nomor yang sama (`baru: false`) tanpa menghabiskan nomor baru. Urutan dua digit per SPPG per
      tahun, dibagi seluruh laporan bernomor. Hak: admin, kepala_sppg, akuntan pada SPPG aktifnya (admin wajib `sppg_id`
      di body); investor, ahli_gizi, staf_gudang, relawan = 403 (dicek sebelum validasi); lintas SPPG = 403. Dicatat di
      audit (`laporan_bgn_nomor_terbit`, hanya terbitan baru, tanpa isi data laporan).
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [tanggal]
            properties:
              sppg_id: { type: integer, description: 'WAJIB untuk admin; peran lain opsional dan harus SPPG aktifnya (lain = 403).' }
              tanggal: { type: string, format: date }
    responses:
      '200':
        description: Nomor terbit atau sudah pernah terbit
        content:
          application/json:
            schema:
              type: object
              properties:
                data: { $ref: '#/components/schemas/NomorLaporanBgn' }
      '401': { $ref: '#/components/responses/Unauthorized' }
      '403': { $ref: '#/components/responses/Forbidden' }
      '422': { $ref: '#/components/responses/ValidationFailed' }
/laporan-bgn/dua-mingguan/nomor:
  post:
    tags: [Laporan BGN]
    summary: Terbitkan nomor LPA Lampiran 30c (idempoten)
    description: |
      Menerbitkan nomor LPA `xx/LPA/x/tahun` untuk periode. IDEMPOTEN per (SPPG, jenis dokumen, periode): panggilan
      ulang mengembalikan nomor yang sama (`baru: false`) tanpa menghabiskan nomor baru. Urutan dua digit per SPPG per
      tahun, dibagi seluruh laporan bernomor. Hak: admin, kepala_sppg, akuntan pada SPPG aktifnya (admin wajib `sppg_id`
      di body); investor, ahli_gizi, staf_gudang, relawan = 403 (dicek sebelum validasi); lintas SPPG = 403. Dicatat di
      audit (`laporan_bgn_nomor_terbit`, hanya terbitan baru, tanpa isi data laporan).
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [tanggal_awal, tanggal_akhir]
            properties:
              sppg_id: { type: integer, description: 'WAJIB untuk admin; peran lain opsional dan harus SPPG aktifnya (lain = 403).' }
              tanggal_awal: { type: string, format: date }
              tanggal_akhir: { type: string, format: date, description: 'Tidak sebelum tanggal_awal; maksimal 16 hari.' }
    responses:
      '200':
        description: Nomor terbit atau sudah pernah terbit
        content:
          application/json:
            schema:
              type: object
              properties:
                data: { $ref: '#/components/schemas/NomorLaporanBgn' }
      '401': { $ref: '#/components/responses/Unauthorized' }
