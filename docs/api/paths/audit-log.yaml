/audit-log:
  get:
    tags: [Audit Log]
    summary: Daftar log audit (khusus Admin)
    description: |
      HANYA Admin aktif (AuditLogPolicy::viewAny); semua peran lain (kepala_sppg, ahli_gizi, akuntan, staf_gudang,
      relawan dapur/distribusi, investor) -> 403, juga untuk query yang tidak valid (otorisasi sebelum validasi).
      Lintas SPPG. Urut terbaru dulu. Paginasi: `per_page` bawaan 25, nilai di atas 100 diturunkan menjadi 100.
      `from`/`to` inklusif (hari penuh, zona waktu aplikasi), `to` >= `from`.
    parameters:
      - name: modul
        in: query
        description: Nama modul (lihat /audit-log/opsi), mis. `keluhan`, `bahan-baku`. Nilai tak dikenal -> 422.
        schema: { type: string }
      - name: user_id
        in: query
        description: Id pelaku.
        schema: { type: integer, minimum: 1 }
      - name: aksi
        in: query
        description: Mis. created, updated, deleted, restored, atau peristiwa khusus (huruf, angka, titik, garis bawah, strip; maks 50).
        schema: { type: string, maxLength: 50 }
      - $ref: '#/components/parameters/DateFrom'
      - $ref: '#/components/parameters/DateTo'
      - name: page
        in: query
        schema: { type: integer, minimum: 1 }
      - name: per_page
        in: query
        schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Paginated'
                - properties:
                    data:
                      type: array
                      items: { $ref: '#/components/schemas/AuditLog' }
      '401': { $ref: '#/components/responses/Unauthorized' }
      '403': { $ref: '#/components/responses/Forbidden' }
      '422': { $ref: '#/components/responses/ValidationFailed' }
/audit-log/opsi:
  get:
    tags: [Audit Log]
    summary: Opsi filter log audit (modul dan aksi)
    description: Khusus Admin. `aksi` = aksi bawaan ditambah peristiwa khusus yang ada di data.
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: object
              properties:
                data: { $ref: '#/components/schemas/AuditLogOpsi' }
      '401': { $ref: '#/components/responses/Unauthorized' }
      '403': { $ref: '#/components/responses/Forbidden' }
/audit-log/{id}:
  get:
    tags: [Audit Log]
    summary: Detail satu log audit (khusus Admin)
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: object
              properties:
                data: { $ref: '#/components/schemas/AuditLog' }
      '401': { $ref: '#/components/responses/Unauthorized' }
      '403': { $ref: '#/components/responses/Forbidden' }
      '404': { $ref: '#/components/responses/NotFound' }
