/keuangan/ringkasan:
  get:
    tags: [Keuangan]
    summary: Ringkasan anggaran per periode (Gambar 16)
    description: |
      Hak R (akuntan, kepala_sppg, admin). Admin wajib `sppg_id`. Periode default = bulan berjalan (WIB).
      anggaran = total pencairan periode; terpakai = total pengeluaran bertanggal di bulan periode;
      sisa = anggaran - terpakai; persen = terpakai/anggaran*100. Status: aman (<80%), peringatan (>=80%),
      habis (=100%), melampaui (>100% atau pengeluaran tanpa pencairan), belum_ada_anggaran.
    parameters:
      - { name: periode, in: query, schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$', examples: ['2026-11'] } }
      - { name: sppg_id, in: query, description: 'Wajib untuk Admin.', schema: { type: integer } }
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: object
              properties:
                data: { $ref: '#/components/schemas/RingkasanKeuangan' }
            example:
              data:
                sppg_id: 1
                periode: '2026-11'
                anggaran: 100000000
                terpakai: 40000000
                sisa: 60000000
                persen: 40
                status: aman
                jumlah_pencairan: 1
                jumlah_pengeluaran: 2
                jumlah_melebihi_anggaran: 0
                per_kategori:
                  - { kategori: bahan_baku, label: Belanja Bahan, nominal: 30000000, jumlah: 1, persen: 75 }
                  - { kategori: energi, label: 'Energi (Gas/Listrik/Air)', nominal: 10000000, jumlah: 1, persen: 25 }
      '401': { $ref: '#/components/responses/Unauthorized' }
      '403': { $ref: '#/components/responses/Forbidden' }
      '404': { $ref: '#/components/responses/NotFound' }
      '422': { $ref: '#/components/responses/ValidationFailed' }
/keuangan/pencairan:
  get:
    tags: [Keuangan]
    summary: Daftar pencairan dana
    description: Hak R (akuntan, kepala_sppg, admin lintas SPPG). Peran lain 403.
    parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      - $ref: '#/components/parameters/Search'
      - $ref: '#/components/parameters/DateFrom'
      - $ref: '#/components/parameters/DateTo'
      - { name: periode, in: query, schema: { type: string, examples: ['2026-11'] } }
      - { name: sppg_id, in: query, description: 'Hanya Admin.', schema: { type: integer } }
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Paginated'
                - properties:
                    data:
                      type: array
                      items: { $ref: '#/components/schemas/PencairanDana' }
      '401': { $ref: '#/components/responses/Unauthorized' }
      '403': { $ref: '#/components/responses/Forbidden' }
      '422': { $ref: '#/components/responses/ValidationFailed' }
  post:
    tags: [Keuangan]
    summary: Catat pencairan dana
    description: |
      Hak C: akuntan (SPPG sendiri). Nominal rupiah bulat > 0. Bukti transfer opsional (multipart `bukti`).
      Pencairan baru menaikkan anggaran periode; penanda peringatan 80%/100% yang tidak lagi berlaku
      dipersenjatai ulang sehingga dapat memicu peringatan lagi.
    parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PencairanDanaInput' }
        multipart/form-data:
          schema: { $ref: '#/components/schemas/PencairanDanaInput' }
    responses:
      '201':
        description: Dibuat
        content:
          application/json:
            schema:
              type: object
              properties:
                data: { $ref: '#/components/schemas/PencairanDana' }
      '401': { $ref: '#/components/responses/Unauthorized' }
      '403': { $ref: '#/components/responses/Forbidden' }
      '409': { $ref: '#/components/responses/Conflict' }
      '422': { $ref: '#/components/responses/UploadRejected' }
      '429': { $ref: '#/components/responses/TooManyRequests' }
/keuangan/pencairan/{id}:
  get:
    tags: [Keuangan]
    summary: Detail pencairan dana
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: object
              properties:
                data: { $ref: '#/components/schemas/PencairanDana' }
      '401': { $ref: '#/components/responses/Unauthorized' }
      '403': { $ref: '#/components/responses/Forbidden' }
      '404': { $ref: '#/components/responses/NotFound' }
  put:
    tags: [Keuangan]
    summary: Ubah pencairan dana (akuntan)
    description: |
      Field opsional. Ganti bukti: multipart POST dengan `_method=PUT`. PATCH = alias.
      Perubahan nominal/periode menghitung ulang ambang kedua periode.
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PencairanDanaInput' }
        multipart/form-data:
          schema: { $ref: '#/components/schemas/PencairanDanaInput' }
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: object
              properties:
                data: { $ref: '#/components/schemas/PencairanDana' }
      '401': { $ref: '#/components/responses/Unauthorized' }
      '403': { $ref: '#/components/responses/Forbidden' }
      '404': { $ref: '#/components/responses/NotFound' }
      '422': { $ref: '#/components/responses/UploadRejected' }
      '429': { $ref: '#/components/responses/TooManyRequests' }
  delete:
    tags: [Keuangan]
    summary: Hapus lunak pencairan dana (akuntan)
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    responses:
      '204': { description: Dihapus (soft delete + audit) }
      '401': { $ref: '#/components/responses/Unauthorized' }
      '403': { $ref: '#/components/responses/Forbidden' }
      '404': { $ref: '#/components/responses/NotFound' }
/keuangan/pengeluaran:
  get:
    tags: [Keuangan]
    summary: Daftar pengeluaran operasional
    description: Hak R (akuntan, kepala_sppg, admin lintas SPPG). Peran lain 403.
    parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      - $ref: '#/components/parameters/Search'
      - $ref: '#/components/parameters/DateFrom'
      - $ref: '#/components/parameters/DateTo'
      - { name: periode, in: query, description: 'Bulan tanggal pengeluaran.', schema: { type: string, examples: ['2026-11'] } }
      - { name: kategori, in: query, schema: { $ref: '#/components/schemas/KategoriPengeluaran' } }
      - { name: pemasok_id, in: query, schema: { type: integer } }
      - { name: pencairan_dana_id, in: query, schema: { type: integer } }
      - { name: melebihi_anggaran, in: query, schema: { type: boolean } }
      - { name: sppg_id, in: query, description: 'Hanya Admin.', schema: { type: integer } }
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Paginated'
                - properties:
                    data:
                      type: array
                      items: { $ref: '#/components/schemas/Pengeluaran' }
      '401': { $ref: '#/components/responses/Unauthorized' }
      '403': { $ref: '#/components/responses/Forbidden' }
      '422': { $ref: '#/components/responses/ValidationFailed' }
  post:
    tags: [Keuangan]
    summary: Catat pengeluaran operasional
    description: |
      Hak C: akuntan. Nominal rupiah bulat > 0; nota opsional (multipart `nota`, SecureUploadService).
      Keputusan FR-09: pengeluaran yang melebihi sisa anggaran periode tetap DICATAT dan ditandai
      `melebihi_anggaran=true` (config `operasional.keuangan.tolak_melebihi_anggaran=true` -> 422).
      Event sekali per (SPPG, periode): `AnggaranMencapai80` (>=80%), `AnggaranMencapai100` (>=100%),
      `AnggaranMelampaui` (>100%); payload {sppg_id, periode, ambang, anggaran, terpakai, sisa, persen}.
      Ditulis atomik (kunci baris SPPG) sehingga kiriman bersamaan tidak menggandakan event.
    parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PengeluaranInput' }
        multipart/form-data:
          schema: { $ref: '#/components/schemas/PengeluaranInput' }
    responses:
      '201':
        description: Dibuat
        content:
          application/json:
            schema:
              type: object
              properties:
                data: { $ref: '#/components/schemas/Pengeluaran' }
      '401': { $ref: '#/components/responses/Unauthorized' }
      '403': { $ref: '#/components/responses/Forbidden' }
      '409': { $ref: '#/components/responses/Conflict' }
      '422': { $ref: '#/components/responses/UploadRejected' }
      '429': { $ref: '#/components/responses/TooManyRequests' }
/keuangan/pengeluaran/{id}:
  get:
    tags: [Keuangan]
    summary: Detail pengeluaran operasional
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: object
              properties:
                data: { $ref: '#/components/schemas/Pengeluaran' }
      '401': { $ref: '#/components/responses/Unauthorized' }
      '403': { $ref: '#/components/responses/Forbidden' }
      '404': { $ref: '#/components/responses/NotFound' }
  put:
    tags: [Keuangan]
    summary: Ubah pengeluaran operasional (akuntan)
    description: |
      Field opsional. Ganti nota: multipart POST dengan `_method=PUT`. PATCH = alias.
      Perubahan nominal/tanggal menghitung ulang `melebihi_anggaran`; edit tidak pernah memancarkan ulang
      event ambang yang sudah terkirim. Perubahan nominal tercatat di audit_logs (nilai lama/baru).
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PengeluaranInput' }
        multipart/form-data:
          schema: { $ref: '#/components/schemas/PengeluaranInput' }
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: object
              properties:
                data: { $ref: '#/components/schemas/Pengeluaran' }
      '401': { $ref: '#/components/responses/Unauthorized' }
      '403': { $ref: '#/components/responses/Forbidden' }
      '404': { $ref: '#/components/responses/NotFound' }
      '422': { $ref: '#/components/responses/UploadRejected' }
      '429': { $ref: '#/components/responses/TooManyRequests' }
  delete:
    tags: [Keuangan]
    summary: Hapus lunak pengeluaran operasional (akuntan)
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    responses:
      '204': { description: Dihapus (soft delete + audit) }
      '401': { $ref: '#/components/responses/Unauthorized' }
      '403': { $ref: '#/components/responses/Forbidden' }
      '404': { $ref: '#/components/responses/NotFound' }
