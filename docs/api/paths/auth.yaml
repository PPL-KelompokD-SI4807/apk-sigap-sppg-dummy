/auth/telegram:
  post:
    tags: [Auth]
    summary: Lapis 1 - validasi initData setiap Mini App dibuka
    description: |
      Memvalidasi HMAC-SHA256 initData (secret = HMAC_SHA256("WebAppData", bot_token)), auth_date
      (maks TELEGRAM_INIT_DATA_MAX_AGE detik, tidak boleh >60 dtk di masa depan), lalu mencocokkan
      user.id dengan akun aktif. Panggil SETIAP kali Mini App dibuka.

      - Bila klien menyimpan token login penuh, kirim di header `Authorization: Bearer <token>`
        beserta `device_id` yang sama: bila sesi itu BERLAKU, milik akun Telegram yang sama, dan perangkat
        yang sama, respons `langkah: sesi_aktif` (tanpa token baru) dan masa sesi digeser (`expires_at`
        baru). Sesi kedaluwarsa/dicabut -> `langkah: masuk` (password; perangkat yang masih tepercaya, yaitu
        < 180 hari sejak token bot terakhir, tanpa token bot).
        initData TIDAK PERNAH cukup untuk login penuh, dan initData basi selalu 401 walau token berlaku.
        Catatan: Telegram.WebApp.initData tetap sama sejak Mini App dibuka (tidak diperbarui selama
        terbuka) dan hanya sah TELEGRAM_INIT_DATA_MAX_AGE detik sejak auth_date; initData baru hanya
        didapat dengan menutup lalu membuka ulang Mini App.
        Bila token login penuh itu milik akun
        LAIN dari akun Telegram initData, token tersebut DICABUT (beserta kepercayaan perangkatnya)
        dan klien wajib membuangnya; respons tetap 200 untuk akun initData (`langkah: masuk`).
      - Selain itu diterbitkan token PRA-LOGIN (ability `auth:pra-login`, 15 menit) yang hanya berlaku
        untuk /auth/masuk, /auth/aktivasi, /auth/lupa-password*, /auth/token/*. Semua rute lain
        menolaknya dengan 403 `alasan: perlu_login_penuh`.
      - `langkah: aktivasi` bila akun belum punya password (undangan baru, sigap:buat-admin, atau
        password di-reset Admin); `langkah: masuk` bila sudah.
      - "Lupa password" = permintaan reset yang wajib DISETUJUI Admin (POST /auth/lupa-password),
        lalu password baru + token bot (POST /auth/lupa-password/lanjut). Admin tanpa Admin lain:
        perintah server `php artisan sigap:reset-password-admin <telegram_id>`.

      Batas laju 10/menit per IP. Bypass dev `init_data=dev_role=<role>` hanya di APP_ENV
      local/testing dengan TELEGRAM_DEV_BYPASS=true dan hanya menerbitkan token pra-login (tidak
      pernah login penuh).
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [init_data]
            properties:
              init_data:
                type: string
                maxLength: 8192
                description: Telegram.WebApp.initData apa adanya (query string).
              device_id:
                type: string
                pattern: '^[A-Za-z0-9_-]{22,128}$'
                description: |
                  ID acak perangkat buatan Mini App (mis. 32 byte acak base64url), disimpan di
                  localStorage (BUKAN CloudStorage). Server hanya menyimpan HMAC-nya.
          example:
            init_data: 'query_id=AAH...&user=%7B%22id%22%3A7012345678%2C%22first_name%22%3A%22Siti%22%7D&auth_date=1793000000&signature=...&hash=5f2c...'
            device_id: 'Qm9va1NpR0FQLWRldmljZS0xMjM0NTY3OA'
    responses:
      '200':
        description: initData sah. Lihat `langkah`.
        content:
          application/json:
            schema:
              oneOf:
                - { $ref: '#/components/schemas/PraLoginResponse' }
                - { $ref: '#/components/schemas/SesiAktifResponse' }
            examples:
              masuk:
                value:
                  langkah: masuk
                  token: '41|pra8Vx...'
                  token_type: Bearer
                  token_jenis: pra_login
                  expires_at: '2026-10-26T08:15:00+07:00'
                  akun: { nama: Siti Rahayu, perlu_username: false }
              aktivasi:
                value:
                  langkah: aktivasi
                  token: '42|pra9Qa...'
                  token_type: Bearer
                  token_jenis: pra_login
                  expires_at: '2026-10-26T08:15:00+07:00'
                  akun: { nama: Admin Fiktif, perlu_username: true }
              sesi_aktif:
                value:
                  langkah: sesi_aktif
                  expires_at: '2027-01-24T07:30:00+07:00'
                  user: { id: 12, name: Siti Rahayu, username: siti.dapur, role: kepala_sppg, role_label: Kepala SPPG, unit: null, sppg_id: 1, sppg_name: SPPG Sukamaju, telegram_username: siti_rahayu, last_login_at: '2026-10-26T07:30:00+07:00', modules: [sppg, jadwal], permissions: { sppg: RU, jadwal: CRUD } }
      '401':
        description: initData tidak sah, kedaluwarsa, atau waktu di masa depan.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            examples:
              hash: { value: { message: 'Tanda tangan initData tidak valid.' } }
              expired: { value: { message: 'initData kedaluwarsa. Tutup lalu buka ulang Mini App.' } }
      '403':
        description: Akun Telegram belum terdaftar, nonaktif, atau terhapus.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
            examples:
              unregistered: { value: { message: 'Akun Telegram Anda belum terdaftar di SiGAP SPPG. Minta tautan undangan (t.me/<bot>?start=<token>) kepada Admin, buka tautan tersebut di Telegram, lalu buka ulang Mini App.' } }
              inactive: { value: { message: 'Akun Anda nonaktif. Hubungi Admin SPPG.' } }
      '422': { $ref: '#/components/responses/ValidationFailed' }
      '429': { $ref: '#/components/responses/TooManyRequests' }
/auth/masuk:
  post:
    tags: [Auth]
    security: [{ bearerAuth: [] }]
    summary: Lapis 2 - masuk dengan username ATAU no telepon + password (token pra-login)
    description: |
      Identitas HANYA dicocokkan dengan akun pemilik token pra-login (akun Telegram dari initData).
      Identitas milik akun lain ditolak dengan pesan yang sama seperti password salah (dan dicatat
      di audit). 5 kali salah -> akun dikunci 15 menit (429 `alasan: terkunci`).
      Perangkat tepercaya -> 200 login penuh langsung; perangkat baru, dicabut, atau kepercayaannya lewat
      180 hari sejak token bot terakhir (tidak bergeser karena dipakai) -> 202, token 6 digit dikirim bot ke
      chat Telegram pengguna, lanjut POST /auth/token/verifikasi. Maks 5 perangkat tepercaya per pengguna:
      kelebihan dicabut (perangkat tanpa sesi lebih dulu, lalu yang paling lama diverifikasi).
      Throttle 10/menit per akun dan 30/menit per IP (semua rute pra-login).
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [identitas, password, device_id]
            properties:
              identitas: { type: string, minLength: 3, maxLength: 32, description: 'Username (diawali huruf, boleh dengan @) atau no telepon (08xx / 62xx / +62xx).' }
              password: { type: string, maxLength: 64 }
              device_id: { type: string, pattern: '^[A-Za-z0-9_-]{22,128}$' }
              label_perangkat: { type: [string, 'null'], maxLength: 120, description: 'Nama perangkat untuk daftar sesi, mis. "Android · Telegram".' }
          example: { identitas: siti.dapur, password: 'Rahasia123x', device_id: 'Qm9va1NpR0FQLWRldmljZS0xMjM0NTY3OA', label_perangkat: 'Android · Telegram' }
    responses:
      '200':
        description: Perangkat tepercaya dengan sesi aktif - login penuh langsung.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginPenuhResponse' }
      '202':
        description: Password benar; token 6 digit dikirim bot.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TantanganResponse' }
      '401': { $ref: '#/components/responses/Unauthorized' }
      '403': { $ref: '#/components/responses/AuthForbidden' }
      '409':
        description: Akun belum diaktivasi (belum punya password) - gunakan /auth/aktivasi.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthError' }
            example: { message: 'Akun belum diaktivasi. Atur username dan password terlebih dahulu.', alasan: perlu_aktivasi, langkah: aktivasi }
      '422':
        description: Validasi gagal, atau identitas/password salah (`alasan: kredensial_salah`).
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthError' }
            example: { message: 'Username/no telepon atau password salah.', errors: { identitas: ['Username/no telepon atau password salah.'] }, alasan: kredensial_salah, sisa_percobaan: 4 }
      '429': { $ref: '#/components/responses/AuthTooManyRequests' }
      '503': { $ref: '#/components/responses/TokenGagalKirim' }
/auth/aktivasi:
  post:
    tags: [Auth]
    security: [{ bearerAuth: [] }]
    summary: Aktivasi / atur password pertama (token pra-login)
    description: |
      Untuk akun tanpa password: akun dari undangan 72 jam (sudah /start di bot), akun
      sigap:buat-admin, atau setelah password di-reset Admin. `username` wajib bila akun belum punya
      username (`akun.perlu_username` dari /auth/telegram). Data baru berlaku SETELAH token 6 digit
      dikonfirmasi lewat POST /auth/token/verifikasi (respons login penuh).
      Password: min 8, huruf besar + kecil, angka, tidak sama dengan username, bukan sandi umum.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [password, password_confirmation, device_id]
            properties:
              username: { type: string, pattern: '^[a-z][a-z0-9._]{2,31}$', description: 'Disimpan huruf kecil; awalan @ dibuang. Bila sudah dipakai: 422 errors.username "Username tidak tersedia. Pilih username lain." (pesan seragam; tiap pemeriksaan memakai jatah tantangan 5/30 menit).' }
              phone: { type: [string, 'null'], description: 'Opsional. 08xx/62xx/+62xx, disimpan E.164. Tidak pernah ditolak karena sudah dipakai (tanpa oracle akun): nomor milik akun lain tidak disimpan dan Admin dapat memperbaikinya. Tidak pernah dikirim ke LLM/chat.' }
              password: { type: string, minLength: 8, maxLength: 64 }
              password_confirmation: { type: string }
              device_id: { type: string, pattern: '^[A-Za-z0-9_-]{22,128}$' }
              label_perangkat: { type: [string, 'null'], maxLength: 120 }
          example: { username: rina.gizi, phone: '0857 1234 5678', password: 'Rahasia123x', password_confirmation: 'Rahasia123x', device_id: 'Qm9va1NpR0FQLWRldmljZS0xMjM0NTY3OA' }
    responses:
      '202':
        description: Token 6 digit dikirim bot.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TantanganResponse' }
      '401': { $ref: '#/components/responses/Unauthorized' }
      '403': { $ref: '#/components/responses/AuthForbidden' }
      '409':
        description: Akun sudah punya password.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthError' }
            example: { message: 'Akun sudah memiliki password. Gunakan Masuk, atau hubungi Admin bila lupa password.', alasan: sudah_aktivasi, langkah: masuk }
      '422': { $ref: '#/components/responses/ValidationFailed' }
      '429': { $ref: '#/components/responses/AuthTooManyRequests' }
      '503': { $ref: '#/components/responses/TokenGagalKirim' }
/auth/lupa-password:
  get:
    tags: [Auth]
    security: [{ bearerAuth: [] }]
    summary: Status permintaan reset password terkini (token pra-login)
    description: Permintaan aktif, atau yang terakhir (ditolak/selesai/kedaluwarsa); `data` null bila belum pernah.
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  oneOf:
                    - { $ref: '#/components/schemas/PermintaanReset' }
                    - { type: 'null' }
      '401': { $ref: '#/components/responses/Unauthorized' }
      '403': { $ref: '#/components/responses/AuthForbidden' }
  post:
    tags: [Auth]
    security: [{ bearerAuth: [] }]
    summary: Lupa password - ajukan permintaan reset ke Admin (token pra-login)
    description: |
      Tidak mengirim token apa pun. Admin dalam scope akun ini diberi tahu lewat bot dan wajib
      memastikan identitas di luar sistem sebelum menyetujui. Satu permintaan aktif per akun
      (menunggu/disetujui, berlaku 24 jam); permintaan ulang saat masih aktif -> 200 dengan permintaan
      yang sama. Maks 3 permintaan baru per 24 jam. Akun terkunci -> 429 `alasan: terkunci`. Akun
      tanpa password -> 409 `perlu_aktivasi`. Admin tanpa Admin lain -> 409 `tidak_ada_pemutus`.
    responses:
      '201':
        description: Permintaan dibuat
        content:
          application/json:
            schema:
              type: object
              required: [message, data]
              properties:
                message: { type: string }
                data: { $ref: '#/components/schemas/PermintaanReset' }
            example:
              message: 'Permintaan reset password dikirim ke Admin. Admin akan memastikan identitas Anda sebelum menyetujui.'
              data: { id: '01JBDQ6V9X8Y7Z6W5V4U3T2S1R', status: menunggu, dibuat_pada: '2026-10-26T08:00:00+07:00', kedaluwarsa_pada: '2026-10-27T08:00:00+07:00', diputuskan_pada: null, selesai_pada: null }
      '200':
        description: Masih ada permintaan aktif (dikembalikan apa adanya).
        content:
          application/json:
            schema:
              type: object
              properties:
                message: { type: string }
                data: { $ref: '#/components/schemas/PermintaanReset' }
      '401': { $ref: '#/components/responses/Unauthorized' }
      '403': { $ref: '#/components/responses/AuthForbidden' }
      '409':
        description: Akun belum diaktivasi, atau tidak ada Admin lain yang dapat menyetujui.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthError' }
      '429': { $ref: '#/components/responses/AuthTooManyRequests' }
/auth/lupa-password/lanjut:
  post:
    tags: [Auth]
    security: [{ bearerAuth: [] }]
    summary: Password baru setelah permintaan reset disetujui (token pra-login)
    description: |
      Hanya bila permintaan akun ini DISETUJUI dan belum kedaluwarsa (selain itu 409
      `reset_belum_disetujui`, tanpa token terkirim). Token 6 digit dikirim bot ke Telegram pemilik
      akun (dari basis data). Password baru berlaku setelah POST /auth/token/verifikasi (`tujuan:
      reset_password`); saat itu SEMUA sesi & perangkat lama dicabut dan permintaan menjadi `selesai`.
      Bila permintaan kedaluwarsa sebelum token dikonfirmasi, verifikasi -> 409 `reset_belum_disetujui`.
      Aturan password sama dengan aktivasi.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [password, password_confirmation, device_id]
            properties:
              password: { type: string, minLength: 8, maxLength: 64 }
              password_confirmation: { type: string }
              device_id: { type: string, pattern: '^[A-Za-z0-9_-]{22,128}$' }
              label_perangkat: { type: [string, 'null'], maxLength: 120 }
          example: { password: 'BaruSekali9z', password_confirmation: 'BaruSekali9z', device_id: 'Qm9va1NpR0FQLWRldmljZS0xMjM0NTY3OA' }
    responses:
      '202':
        description: Token 6 digit dikirim bot.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TantanganResponse' }
      '401': { $ref: '#/components/responses/Unauthorized' }
      '403': { $ref: '#/components/responses/AuthForbidden' }
      '409':
        description: Permintaan belum disetujui / kedaluwarsa (`reset_belum_disetujui`) atau akun tanpa password (`perlu_aktivasi`).
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthError' }
            example: { message: 'Permintaan reset password belum disetujui Admin atau sudah kedaluwarsa.', alasan: reset_belum_disetujui }
      '422': { $ref: '#/components/responses/ValidationFailed' }
      '429': { $ref: '#/components/responses/AuthTooManyRequests' }
      '503': { $ref: '#/components/responses/TokenGagalKirim' }
/auth/token/verifikasi:
  post:
    tags: [Auth]
    security: [{ bearerAuth: [] }]
    summary: Konfirmasi token 6 digit -> token login penuh (token pra-login)
    description: |
      Token berlaku 5 menit, sekali pakai, terikat ke akun + device_id + token PRA-LOGIN yang
      memintanya. Bila Mini App ditutup lalu dibuka ulang (token pra-login baru), tantangan lama
      tidak berlaku (`alasan: token_tidak_valid`): ulangi dari Masuk/Aktivasi. Simpan token pra-login
      dan `tantangan.id` di memori selama layar token terbuka. 5 kali salah -> tantangan hangus.
      Respons sukses berisi token login penuh (ability `auth:penuh`, `expires_at` = sekarang + 90 hari;
      Admin 30 hari; lihat skema LoginPenuhResponse). Token pra-login yang dipakai otomatis dicabut.
      Login di atas 5 sesi per pengguna mencabut sesi yang paling lama tidak dipakai.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [tantangan_id, kode, device_id]
            properties:
              tantangan_id: { type: string, format: ulid }
              kode: { type: string, pattern: '^\d{6}$' }
              device_id: { type: string, pattern: '^[A-Za-z0-9_-]{22,128}$' }
          example: { tantangan_id: '01JBDQ6V9X8Y7Z6W5V4U3T2S1R', kode: '493817', device_id: 'Qm9va1NpR0FQLWRldmljZS0xMjM0NTY3OA' }
    responses:
      '200':
        description: Login penuh.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginPenuhResponse' }
      '401': { $ref: '#/components/responses/Unauthorized' }
      '403': { $ref: '#/components/responses/AuthForbidden' }
      '422':
        description: |
          Validasi gagal atau token ditolak. `alasan`: token_salah (+ sisa_percobaan),
          token_kedaluwarsa (boleh kirim ulang), token_dipakai, token_hangus, token_tidak_valid
          (tantangan tidak ada / milik akun atau perangkat lain) - tiga terakhir: ulangi dari awal.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthError' }
            examples:
              salah: { value: { message: 'Token salah. Sisa percobaan: 4.', errors: { kode: ['Token salah. Sisa percobaan: 4.'] }, alasan: token_salah, sisa_percobaan: 4 } }
              kedaluwarsa: { value: { message: 'Token kedaluwarsa. Minta kirim ulang token.', errors: { kode: ['Token kedaluwarsa. Minta kirim ulang token.'] }, alasan: token_kedaluwarsa } }
              hangus: { value: { message: 'Token tidak berlaku lagi karena terlalu banyak percobaan salah. Ulangi dari awal untuk meminta token baru.', errors: { kode: ['...'] }, alasan: token_hangus } }
      '429': { $ref: '#/components/responses/AuthTooManyRequests' }
/auth/token/kirim-ulang:
  post:
    tags: [Auth]
    security: [{ bearerAuth: [] }]
    summary: Kirim ulang token 6 digit (token pra-login)
    description: |
      Kode baru (kode lama tidak berlaku), masa berlaku 5 menit lagi. Jeda 60 detik, maks 3 kali per
      tantangan. Hitungan percobaan salah TIDAK di-reset (`sisa_percobaan` berlanjut; total 5 per tantangan).
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [tantangan_id, device_id]
            properties:
              tantangan_id: { type: string, format: ulid }
              device_id: { type: string, pattern: '^[A-Za-z0-9_-]{22,128}$' }
    responses:
      '202':
        description: Token baru dikirim bot.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TantanganResponse' }
      '401': { $ref: '#/components/responses/Unauthorized' }
      '403': { $ref: '#/components/responses/AuthForbidden' }
      '422':
        description: Tantangan tidak berlaku lagi (`alasan: token_tidak_valid`).
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthError' }
      '429': { $ref: '#/components/responses/AuthTooManyRequests' }
      '503': { $ref: '#/components/responses/TokenGagalKirim' }
/auth/me:
  get:
    tags: [Auth]
    summary: Profil pengguna login dan hak akses efektif (login penuh)
    description: |
      `expires_at` = akhir masa sesi bergeser saat ini (sudah termasuk perpanjangan oleh permintaan ini),
      `batas_absolut_at` = batas yang tidak dapat diperpanjang = min(login + 180 hari, akhir kepercayaan
      perangkat = token bot terakhir + 180 hari); dapat lebih awal dari login + 180 hari.
      Sesi web (cookie, R-04): `expires_at` juga dijepit idle 12 jam; respons menambah `jenis_sesi: web` dan
      `csrf` (token CSRF sesi ini untuk header `X-CSRF-Token`; simpan di memori JS saja). Respons Bearer
      (Mini App) tidak memuat kedua field itu.
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: object
              required: [user]
              properties:
                user: { $ref: '#/components/schemas/AuthUser' }
                expires_at: { type: [string, 'null'], format: date-time, description: 'Akhir masa sesi bergeser (90 hari sejak terakhir dipakai; Admin 30; sesi web biasa: idle 12 jam). null hanya untuk token tiruan tes.' }
                batas_absolut_at: { type: [string, 'null'], format: date-time, description: 'Batas efektif yang tidak dapat diperpanjang: min(login + 180 hari, token bot terakhir perangkat + 180 hari); expires_at tidak pernah melewatinya.' }
                jenis_sesi: { type: string, const: web, description: 'Hanya pada jalur cookie web.' }
                csrf: { type: string, pattern: '^[0-9a-f]{64}$', description: 'Hanya pada jalur cookie web: nilai header X-CSRF-Token untuk metode pengubah, terikat sesi ini.' }
            examples:
              relawan_dapur:
                summary: Relawan unit dapur (peta hak ringkas)
                value:
                  user:
                    id: 12
                    name: 'Siti Rahayu'
                    username: 'siti.dapur'
                    role: relawan
                    role_label: Relawan
                    unit: dapur
                    sppg_id: 1
                    sppg_name: 'SPPG Sukamaju'
                    sppg_aktif_id: 1
                    multi_sppg: false
                    modules: [pengguna, sppg, titik-layanan, menu-gizi, jadwal, log-produksi, mutu, armada, keluhan]
                    permissions: { pengguna: 'R*', sppg: R, 'titik-layanan': R, 'menu-gizi': R, jadwal: CRU, 'log-produksi': CRU, mutu: R, armada: R, keluhan: CR }
                    baca_saja: false
                    agregat: []
                    keputusan: []
