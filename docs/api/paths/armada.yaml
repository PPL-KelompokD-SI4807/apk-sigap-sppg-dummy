/armada:
  get:
    tags: [Armada]
    summary: Daftar armada
    description: 'Hak: Admin & Kepala SPPG CRUD; Akuntan & Relawan R.'
    parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      - $ref: '#/components/parameters/Search'
      - { name: status, in: query, schema: { type: string, enum: [tersedia, bertugas, servis] } }
      - { name: sppg_id, in: query, description: 'Hanya berpengaruh untuk Admin.', schema: { type: integer } }
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Paginated'
                - properties:
                    data:
                      type: array
                      items: { $ref: '#/components/schemas/Armada' }
      '401': { $ref: '#/components/responses/Unauthorized' }
      '403': { $ref: '#/components/responses/Forbidden' }
      '429': { $ref: '#/components/responses/TooManyRequests' }
  post:
    tags: [Armada]
    summary: Tambah armada
    description: '`plat_nomor` dinormalkan (huruf besar, spasi tunggal) dan unik per SPPG termasuk yang terhapus lunak. Admin wajib mengirim `sppg_id`.'
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ArmadaInput' }
    responses:
      '201':
        description: Dibuat
        content:
          application/json:
            schema:
              type: object
              properties:
                data: { $ref: '#/components/schemas/Armada' }
      '401': { $ref: '#/components/responses/Unauthorized' }
      '403': { $ref: '#/components/responses/Forbidden' }
      '422': { $ref: '#/components/responses/ValidationFailed' }
      '429': { $ref: '#/components/responses/TooManyRequests' }
/armada/{id}:
  parameters:
    - { name: id, in: path, required: true, schema: { type: integer } }
  get:
    tags: [Armada]
    summary: Detail armada
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: object
              properties:
                data: { $ref: '#/components/schemas/Armada' }
      '401': { $ref: '#/components/responses/Unauthorized' }
      '403': { $ref: '#/components/responses/Forbidden' }
      '404': { $ref: '#/components/responses/NotFound' }
  put:
    tags: [Armada]
    summary: Ubah armada
    description: 'Plat nomor tetap unik per SPPG.'
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ArmadaInput' }
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: object
              properties:
                data: { $ref: '#/components/schemas/Armada' }
      '401': { $ref: '#/components/responses/Unauthorized' }
      '403': { $ref: '#/components/responses/Forbidden' }
      '404': { $ref: '#/components/responses/NotFound' }
      '422': { $ref: '#/components/responses/ValidationFailed' }
  patch:
    tags: [Armada]
    summary: Ubah sebagian armada
    description: Sama dengan PUT; field yang tidak dikirim tidak berubah.
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ArmadaInput' }
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: object
              properties:
                data: { $ref: '#/components/schemas/Armada' }
      '401': { $ref: '#/components/responses/Unauthorized' }
      '403': { $ref: '#/components/responses/Forbidden' }
      '404': { $ref: '#/components/responses/NotFound' }
      '422': { $ref: '#/components/responses/ValidationFailed' }
  delete:
    tags: [Armada]
    summary: Hapus lunak armada
    description: 'Hapus lunak. Armada berstatus `bertugas` tidak dapat dihapus (422).'
    responses:
      '204': { description: Dihapus }
      '401': { $ref: '#/components/responses/Unauthorized' }
      '403': { $ref: '#/components/responses/Forbidden' }
      '404': { $ref: '#/components/responses/NotFound' }
      '422': { $ref: '#/components/responses/ValidationFailed' }
/pengemudi:
  get:
    tags: [Armada]
    summary: Daftar pengemudi
    description: 'Modul Armada dan Pengemudi (matriks hak sama dengan /armada). `no_sim` dan `sim_berlaku_hingga` hanya terlihat oleh peran yang boleh mengubah (Admin, Kepala SPPG); peran R lain melihat `sim_status` saja.'
    parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      - $ref: '#/components/parameters/Search'
      - { name: is_active, in: query, schema: { type: boolean } }
      - { name: sppg_id, in: query, description: 'Hanya berpengaruh untuk Admin.', schema: { type: integer } }
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Paginated'
                - properties:
                    data:
                      type: array
                      items: { $ref: '#/components/schemas/Pengemudi' }
      '401': { $ref: '#/components/responses/Unauthorized' }
      '403': { $ref: '#/components/responses/Forbidden' }
      '429': { $ref: '#/components/responses/TooManyRequests' }
  post:
    tags: [Armada]
    summary: Tambah pengemudi
    description: 'Bila `no_sim` diisi maka `sim_berlaku_hingga` wajib dan tidak boleh sebelum hari ini.'
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PengemudiInput' }
    responses:
      '201':
        description: Dibuat
        content:
          application/json:
            schema:
              type: object
              properties:
                data: { $ref: '#/components/schemas/Pengemudi' }
      '401': { $ref: '#/components/responses/Unauthorized' }
      '403': { $ref: '#/components/responses/Forbidden' }
      '422': { $ref: '#/components/responses/ValidationFailed' }
      '429': { $ref: '#/components/responses/TooManyRequests' }
/pengemudi/{id}:
  parameters:
