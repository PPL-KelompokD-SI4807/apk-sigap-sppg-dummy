                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Pengemudi' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      tags: [Armada]
      summary: Tambah pengemudi
      description: 'Bila `no_sim` diisi maka `sim_berlaku_hingga` wajib dan tidak boleh sebelum hari ini.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PengemudiInput' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Pengemudi' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /pengemudi/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Armada]
      summary: Detail pengemudi
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Pengemudi' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Armada]
      summary: Ubah pengemudi
      description: 'Tanggal masa berlaku SIM yang dikirim tidak boleh sebelum hari ini.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PengemudiInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Pengemudi' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    patch:
      tags: [Armada]
      summary: Ubah sebagian pengemudi
      description: Sama dengan PUT; field yang tidak dikirim tidak berubah.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PengemudiInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Pengemudi' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [Armada]
      summary: Hapus lunak pengemudi
      description: 'Hapus lunak.'
      responses:
        '204': { description: Dihapus }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /auth/telegram:
    post:
      tags: [Auth]
      summary: Tukar initData Telegram dengan token Bearer
      description: |
        Memvalidasi HMAC-SHA256 initData (secret = HMAC_SHA256("WebAppData", bot_token)),
        auth_date (maks TELEGRAM_INIT_DATA_MAX_AGE detik, tidak boleh >60 dtk di masa depan),
        lalu mencocokkan user.id dengan akun aktif. Token lama untuk `device` yang sama dicabut.
        Batas laju 10/menit per IP. Bypass dev `init_data=dev_role=<role>` hanya di APP_ENV
        local/testing dengan TELEGRAM_DEV_BYPASS=true.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [init_data]
              properties:
                init_data:
                  type: string
                  maxLength: 8192
                  description: Telegram.WebApp.initData apa adanya (query string).
                device:
                  type: string
                  maxLength: 64
                  pattern: '^[A-Za-z0-9._-]+$'
                  default: miniapp
            example:
              init_data: 'query_id=AAH...&user=%7B%22id%22%3A7012345678%2C%22first_name%22%3A%22Siti%22%7D&auth_date=1793000000&signature=...&hash=5f2c...'
      responses:
        '200':
          description: Login berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
              example:
                token: '1|q8VxS2...'
                token_type: Bearer
                expires_at: '2026-10-26T15:30:00+07:00'
                user:
                  id: 12
                  name: Siti Rahayu
                  role: kepala_sppg
                  role_label: Kepala SPPG
                  unit: null
                  sppg_id: 1
                  sppg_name: SPPG Sukamaju
                  telegram_username: siti_rahayu
                  last_login_at: '2026-10-26T07:30:00+07:00'
                  modules: [pengguna, notifikasi-perjalanan, sppg, titik-layanan, penerima-manfaat, bahan-baku, pemasok, menu-gizi, jadwal, log-produksi, mutu, armada, bukti-distribusi, keuangan, keluhan, rekap-harian]
                  permissions: { pengguna: R, sppg: RU, jadwal: CRUD, keuangan: R }
        '401':
          description: initData tidak sah, kedaluwarsa, atau waktu di masa depan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                hash: { value: { message: 'Tanda tangan initData tidak valid.' } }
                expired: { value: { message: 'initData kedaluwarsa. Tutup lalu buka ulang Mini App.' } }
        '403':
          description: Akun Telegram belum terdaftar, nonaktif, atau terhapus.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                unregistered: { value: { message: 'Akun Telegram Anda belum terdaftar di SiGAP SPPG. Minta tautan undangan (t.me/<bot>?start=<token>) kepada Admin, buka tautan tersebut di Telegram, lalu buka ulang Mini App.' } }
                inactive: { value: { message: 'Akun Anda nonaktif. Hubungi Admin SPPG.' } }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/me:
    get:
      tags: [Auth]
      summary: Profil pengguna login dan hak akses efektif
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/AuthUser' }
                  expires_at: { type: [string, 'null'], format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Cabut token yang sedang dipakai
      responses:
        '200':
          description: Token dicabut
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { message: 'Berhasil keluar.' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /bahan-baku:
    get:
      tags: [Bahan Baku]
      summary: Daftar bahan baku (SPPG pengguna; Admin lintas SPPG)
      description: |
        Hak: R (admin, kepala_sppg, ahli_gizi, akuntan, staf_gudang). Filter: `q` (nama/kode),
        `kategori`, `pemasok_id`, `stok_menipis=1`, `sppg_id` (hanya Admin).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - { name: kategori, in: query, schema: { $ref: '#/components/schemas/KategoriBahan' } }
        - { name: pemasok_id, in: query, schema: { type: integer } }
        - { name: stok_menipis, in: query, schema: { type: integer, enum: [0, 1] } }
        - { name: sppg_id, in: query, description: 'Hanya dipakai Admin', schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/BahanBaku' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Bahan Baku]
      summary: Tambah bahan baku (stok awal 0; isi lewat mutasi masuk)
      description: |
        Hak: C (admin, staf_gudang). `sppg_id` hanya dipakai Admin (wajib); diabaikan untuk peran lain.
        Menerima `ai_draft_id` opsional (draf Agen AI ditandai confirmed setelah sukses).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BahanBakuInput' }
            example: { nama: 'Beras Premium', kode: 'BB-001', kategori: karbohidrat, satuan: kg, stok_minimum: 50, pemasok_id: 3 }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/BahanBaku' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /bahan-baku/stok-menipis:
    get:
      tags: [Bahan Baku]
      summary: Bahan dengan stok <= stok minimum
      description: Hak R. Diurutkan dari rasio stok/minimum terkecil.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/BahanBaku' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /bahan-baku/kedaluwarsa-dekat:
    get:
      tags: [Bahan Baku]
      summary: Bahan (stok > 0) yang kedaluwarsa dalam N hari ke depan atau sudah lewat
      description: Hak R. Ambang default `config('gudang.kedaluwarsa_hari')` = 3 hari.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - { name: hari, in: query, description: 'Ambang hari (0-365), default 3', schema: { type: integer, minimum: 0, maximum: 365, default: 3 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/BahanBaku' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /bahan-baku/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Bahan Baku]
      summary: Detail bahan baku
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/BahanBaku' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Bahan Baku]
      summary: Ubah bahan baku (stok TIDAK dapat diubah di sini; pakai mutasi)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BahanBakuInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/BahanBaku' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    patch:
      tags: [Bahan Baku]
      summary: Ubah sebagian bahan baku
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BahanBakuInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/BahanBaku' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [Bahan Baku]
      summary: Hapus lunak bahan baku
      description: Ditolak (422) bila bahan masih dipakai komposisi menu aktif.
      responses:
        '204': { description: Terhapus }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /bahan-baku/{id}/mutasi:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Bahan Baku]
      summary: Riwayat mutasi stok bahan
      description: Hak R. Filter `jenis`, `from`/`to` (tanggal_mutasi).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - { name: jenis, in: query, schema: { $ref: '#/components/schemas/JenisMutasi' } }
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/MutasiStok' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Bahan Baku]
      summary: Catat mutasi stok (masuk/keluar/penyesuaian), atomik
      description: |
        Hak U pada bahan baku (admin, staf_gudang). Transaksi + kunci baris bahan; stok tidak boleh
        negatif (422 pada `jumlah`). `masuk`/`keluar`: jumlah > 0. `penyesuaian`: jumlah selisih bertanda
        (boleh negatif, bukan 0) dan `catatan` (alasan) wajib. `keluar` wajib `jadwal_produksi_id` atau
        `catatan`. `pemasok_id` dan `tanggal_kedaluwarsa` hanya untuk `masuk`. Stok per batch dihitung FEFO
        dari mutasi masuk bertanggal kedaluwarsa (lihat /bahan-baku/{id}/batch). Pencatat = pengguna login.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MutasiStokInput' }
            examples:
              masuk:
                value: { jenis: masuk, jumlah: 100, pemasok_id: 3, harga_satuan: 14500, tanggal_kedaluwarsa: '2027-01-15', catatan: 'Pengiriman pagi' }
              keluar:
                value: { jenis: keluar, jumlah: 25.5, jadwal_produksi_id: 12 }
              penyesuaian:
                value: { jenis: penyesuaian, jumlah: -2, catatan: 'Susut timbang hasil stok opname' }
      responses:
        '201':
          description: Mutasi tercatat, saldo diperbarui
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/MutasiStok' }
                  bahan_baku: { $ref: '#/components/schemas/BahanBaku' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /bahan-baku/{id}/batch:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Bahan Baku]
      summary: Stok per batch (FEFO: kedaluwarsa terdekat habis lebih dulu)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/BatchStok' }
                  stok_tanpa_batch:
                    type: string
                    description: Stok yang tidak terikat batch masuk (stok awal/penyesuaian positif).
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /bukti-distribusi:
    get:
      tags: [Bukti Distribusi]
      summary: Daftar bukti distribusi
      description: |
        Hak R (Tabel 5): admin (lintas SPPG), kepala_sppg, ahli_gizi, akuntan, relawan unit distribusi.
        Relawan hanya melihat bukti yang ia catat atau untuk jadwal yang ditugaskan kepadanya.
        Urut waktu tiba terbaru. from/to memfilter tanggal `waktu_tiba`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - { name: terlambat, in: query, schema: { type: boolean } }
        - { name: jadwal_distribusi_id, in: query, schema: { type: integer } }
        - { name: titik_layanan_id, in: query, schema: { type: integer } }
        - { name: tanggal, in: query, description: Tanggal distribusi jadwal, schema: { type: string, format: date } }
        - { name: sppg_id, in: query, description: 'Hanya Admin.', schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/BuktiDistribusi' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Bukti Distribusi]
      summary: Catat bukti serah terima (multipart)
      description: |
        Hak C: kepala_sppg, relawan unit distribusi. Relawan: hanya jadwal hari ini (WIB) yang
        ditugaskan kepadanya atau belum punya petugas (jadwal petugas lain -> 403); `waktu_tiba` =
        waktu server. Jadwal dibatalkan, belum siap (menunggu), atau ditahan mutu (pemeriksaan terbaru
        bukan Layak) -> 422 pada `jadwal_distribusi_id`. Satu bukti per jadwal (sudah ada -> 422; bukti
        terhapus lunak dipulihkan dan ditimpa).
        Keterlambatan: acuan = estimasi_tiba perjalanan terakhir, atau tanggal_distribusi + jam_rencana_tiba;
        `terlambat` bila selisih > 15 menit (config). Setelah tersimpan: status jadwal -> diterima,
        perjalanan aktif -> tiba, event `BuktiDistribusiDicatat` (+ `DistribusiTerlambat` bila terlambat).
        Foto diverifikasi SecureUploadService (lihat POST /lampiran). Batas laju unggah 20/menit.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/BuktiDistribusiInput' }
            example:
              jadwal_distribusi_id: 31
              porsi_diterima: 238
              nama_pic: Ibu Contoh
              catatan_selisih: '2 porsi tumpah saat bongkar'
              latitude: -6.2
              longitude: 106.8
              foto: (binary)
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/BuktiDistribusi' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UploadRejected' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /bukti-distribusi/{id}:
    get:
      tags: [Bukti Distribusi]
      summary: Detail bukti distribusi
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/BuktiDistribusi' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Bukti Distribusi]
      summary: Ubah bukti distribusi
      description: |
        Hak U: kepala_sppg; relawan hanya bukti yang ia catat pada hari yang sama. JSON untuk field
        teks; untuk mengganti foto kirim multipart lewat POST /bukti-distribusi/{id} dengan `_method=PUT`
        (foto lama tetap tersimpan sebagai lampiran untuk jejak audit). PATCH diterima sebagai alias.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BuktiDistribusiUpdateInput' }
            example: { nama_pic: Bapak Contoh, porsi_diterima: 239, catatan_selisih: '1 porsi rusak' }
          multipart/form-data:
            schema: { $ref: '#/components/schemas/BuktiDistribusiUpdateInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/BuktiDistribusi' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UploadRejected' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      tags: [Bukti Distribusi]
      summary: Hapus lunak bukti distribusi (Kepala SPPG)
      description: Status jadwal yang "diterima" kembali ke "berangkat" sehingga bukti dapat dicatat ulang.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '204': { description: Dihapus (soft delete + audit) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /jadwal:
    get:
      tags: [Jadwal]
      summary: Daftar jadwal produksi
      description: |
        Hak R pada jadwal produksi (admin, kepala_sppg, ahli_gizi, staf_gudang, relawan unit dapur).
        Filter: `q` (catatan/nama menu), `status`, `tanggal`, `from`/`to`, `menu_id`, `sppg_id` (Admin).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - { name: status, in: query, schema: { $ref: '#/components/schemas/StatusJadwalProduksi' } }
        - { name: tanggal, in: query, schema: { type: string, format: date } }
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - { name: menu_id, in: query, schema: { type: integer } }
        - { name: sppg_id, in: query, description: 'Hanya dipakai Admin', schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/JadwalProduksi' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Jadwal]
      summary: Buat jadwal produksi (validasi kapasitas harian SPPG)
      description: |
        Hak C (kepala_sppg, ahli_gizi, relawan unit dapur). Status awal selalu `direncanakan`.
        422 pada `target_porsi` bila target > kapasitas harian SPPG atau total jadwal (tidak dibatalkan)
        pada tanggal tersebut > kapasitas. Bila stok tidak cukup, event `KekuranganBahan` dipancarkan
        (notifikasi Staf Gudang) dan respons memuat `kekurangan_bahan`. Menerima `ai_draft_id` opsional.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JadwalProduksiInput' }
            example: { menu_id: 5, tanggal_produksi: '2026-11-02', jam_mulai_masak: '03:00', target_porsi: 2500, catatan: 'Hari pertama pekan' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/JadwalProduksi' }
                  kekurangan_bahan:
                    type: array
                    description: Bahan yang stoknya kurang untuk target ini (kosong bila cukup)
                    items: { $ref: '#/components/schemas/KebutuhanBahanItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: Validasi gagal (termasuk kapasitas harian terlampaui)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
              example:
                message: 'Data yang dikirim tidak valid.'
                errors:
                  target_porsi: ['Total jadwal tanggal 2026-11-02 menjadi 3500 porsi (2000 sudah terjadwal + 1500 baru), melebihi kapasitas harian 3000 porsi. Sisa kapasitas 1000 porsi.']
  /jadwal/produksi-ringkas:
    get:
      tags: [Jadwal]
      summary: Ringkasan jadwal produksi per tanggal (untuk pilihan di form distribusi)
      description: |
        Daftar ringkas tanpa data sensitif (id, tanggal, nama menu, target porsi, status) agar form jadwal
        distribusi/bukti dapat memilih jadwal produksi. Dibuka untuk SEMUA peran yang punya hak R modul
        jadwal, termasuk relawan unit distribusi yang tidak boleh membaca jadwal produksi penuh
        (`GET /jadwal`): admin, kepala_sppg, ahli_gizi, staf_gudang, relawan (unit dapur/distribusi).
        Akuntan dan relawan tanpa unit mendapat 403. Dibatasi SPPG pengguna (Admin: opsional `sppg_id`).
        Jadwal terhapus lunak tidak disertakan; status `dibatalkan` tetap disertakan (klien menyaring).
        Tanpa paginasi, maks 200 baris, urut jam mulai masak.
      parameters:
        - { name: tanggal, in: query, description: 'YYYY-MM-DD; default hari ini (WIB)', schema: { type: string, format: date } }
        - { name: sppg_id, in: query, description: 'Hanya dipakai Admin', schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/JadwalProduksiRingkas' }
              example:
                data:
                  - { id: 12, tanggal_produksi: '2026-11-02', nama_menu: 'Nasi, ayam suwir, sayur bayam', target_porsi: 2500, status: direncanakan, status_label: Direncanakan }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /jadwal/distribusi:
    get:
      tags: [Jadwal]
