# BERKAS DIHASILKAN OTOMATIS oleh docs/api/build-openapi.php. Jangan edit langsung;
# ubah docs/api/base.yaml, docs/api/paths/*.yaml, atau docs/api/components/*.yaml.
openapi: 3.1.0
info:
  title: SiGAP SPPG API
  version: 1.0.0
  description: |
    REST API backend SiGAP SPPG untuk Telegram Mini App.
    Autentikasi: tukar Telegram.WebApp.initData dengan token Bearer (Sanctum, 8 jam) melalui
    POST /auth/telegram, lalu kirim header `Authorization: Bearer <token>`.
    Otorisasi mengikuti matriks CRUD Tabel 5 (config/rbac.php) dan dibatasi SPPG pengguna
    (kecuali Admin). Galat selalu berbentuk `{message, errors?}`.
    BERKAS INI DIHASILKAN oleh docs/api/build-openapi.php — jangan diedit langsung.
servers:
  - url: /api/v1
    description: Relatif terhadap domain aplikasi
  - url: http://localhost:8080/api/v1
    description: Docker Compose lokal
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Login Telegram (initData) dan sesi token
paths:
  /ai-drafts:
    get:
      tags: [Agen AI]
      summary: Daftar draf AI pending milik sendiri
      description: 'Draf berstatus pending yang belum kedaluwarsa milik pengguna login (maks 10, terbaru dulu). Draf pengguna lain tidak pernah ditampilkan.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AiDraft' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /ai-drafts/{uuid}:
    parameters:
      - { name: uuid, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Agen AI]
      summary: Detail draf AI (prefill formulir)
      description: |
        Hanya pemilik draf pada SPPG yang sama; selain itu 404. Draf kedaluwarsa (default 30 menit),
        sudah disimpan, atau dibuang -> 410. `errors` = validasi dry-run Form Request modul saat ini.
        Mini App lalu memanggil endpoint modul (mis. POST /titik-layanan) dengan `ai_draft_id`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AiDraft' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410':
          description: Draf kedaluwarsa, sudah disimpan, atau sudah dibuang.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { message: 'Draf sudah kedaluwarsa. Kirim ulang pesan ke bot atau isi formulir manual.' }
    delete:
      tags: [Agen AI]
      summary: Buang draf AI
      description: 'Idempoten untuk draf pending/kedaluwarsa/dibuang. Draf yang sudah disimpan -> 409. Bukan pemilik -> 404.'
      responses:
        '204': { description: Dibuang }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Draf sudah disimpan (confirmed).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /armada:
    get:
      tags: [Armada]
      summary: Daftar armada
      description: 'Hak: Admin & Kepala SPPG CRUD; Akuntan & Relawan R.'
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - { name: status, in: query, schema: { type: string, enum: [tersedia, bertugas, servis] } }
        - { name: sppg_id, in: query, description: 'Hanya berpengaruh untuk Admin.', schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Armada' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      tags: [Armada]
      summary: Tambah armada
      description: '`plat_nomor` dinormalkan (huruf besar, spasi tunggal) dan unik per SPPG termasuk yang terhapus lunak. Admin wajib mengirim `sppg_id`.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArmadaInput' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Armada' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /armada/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Armada]
      summary: Detail armada
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Armada' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Armada]
      summary: Ubah armada
      description: 'Plat nomor tetap unik per SPPG.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArmadaInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Armada' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    patch:
      tags: [Armada]
      summary: Ubah sebagian armada
      description: Sama dengan PUT; field yang tidak dikirim tidak berubah.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArmadaInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Armada' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [Armada]
      summary: Hapus lunak armada
      description: 'Hapus lunak. Armada berstatus `bertugas` tidak dapat dihapus (422).'
      responses:
        '204': { description: Dihapus }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /pengemudi:
    get:
      tags: [Armada]
      summary: Daftar pengemudi
      description: 'Modul Armada dan Pengemudi (matriks hak sama dengan /armada). `no_sim` dan `sim_berlaku_hingga` hanya terlihat oleh peran yang boleh mengubah (Admin, Kepala SPPG); peran R lain melihat `sim_status` saja.'
