        Kebutuhan = Sum(gram_per_porsi x target_porsi) per bahan menu, dikonversi ke satuan stok memakai
        `config('produksi.konversi_gram')` (kg, g, liter, ml). Bahan bersatuan lain (butir, ikat, ...)
        tidak dapat dibandingkan (`dapat_dibandingkan=false`, kekurangan null).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/KebutuhanBahan' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /keluhan:
    get:
      tags: [Keluhan]
      summary: Daftar feedback dan keluhan
      description: |
        Hak R. Admin lintas SPPG; peran lain SPPG-nya; relawan hanya keluhan yang ia catat sendiri.
        Urut terbaru. Filter rentang tanggal memakai tanggal pencatatan (`created_at`).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/StatusKeluhan' }
        - name: prioritas
          in: query
          schema: { $ref: '#/components/schemas/PrioritasKeluhan' }
        - name: kategori
          in: query
          schema: { $ref: '#/components/schemas/KategoriKeluhan' }
        - name: titik_layanan_id
          in: query
          schema: { type: integer }
        - name: jadwal_produksi_id
          in: query
          schema: { type: integer }
        - name: sppg_id
          in: query
          description: Hanya Admin; peran lain diabaikan.
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Keluhan' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Keluhan]
      summary: Catat keluhan
      description: |
        Hak C (Admin, relawan). Prioritas otomatis dari kategori (makanan_basi, gejala_sakit = kritis;
        porsi_kurang, terlambat = sedang; lainnya rendah); `prioritas` input hanya dapat menaikkan.
        Keluhan kritis: `dieskalasi_pada` diisi, event `KeluhanKritis` dipancarkan, dan WAJIB terkait
        jadwal produksi (batch). Bila `jadwal_produksi_id` kosong tetapi `titik_layanan_id` diisi,
        batch disimpulkan dari jadwal distribusi titik tersebut hari ini; bila tetap tidak diketahui,
        kirim `batch_tidak_diketahui=true`, jika tidak 422 pada `jadwal_produksi_id`.
        Admin wajib mengirim `sppg_id`; untuk peran lain `sppg_id` diabaikan.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KeluhanInput' }
            example:
              sumber: guru
              kategori: makanan_basi
              titik_layanan_id: 3
              jadwal_produksi_id: 18
              deskripsi: 'Lauk ayam berbau basi, beberapa siswa mual.'
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Keluhan' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /keluhan/ringkasan:
    get:
      tags: [Keluhan]
      summary: Ringkasan jumlah keluhan per status
      description: Hak R; cakupan sama dengan daftar. Mendukung filter from/to (tanggal pencatatan).
      parameters:
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - name: sppg_id
          in: query
          description: Hanya Admin; peran lain diabaikan.
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/KeluhanRingkasan' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /keluhan/{id}:
    get:
      tags: [Keluhan]
      summary: Detail keluhan
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Keluhan' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Keluhan]
      summary: Ubah keluhan / tindak lanjut
      description: |
        Hak U. Kepala SPPG dan Ahli Gizi hanya dapat mengubah `status` dan `tindak_lanjut`; Admin dapat
        mengubah semua field. Transisi status: baru -> diproses -> selesai | ditolak (selesai/ditolak final,
        `tindak_lanjut` wajib terisi saat selesai atau ditolak). Transisi tidak valid: 422 pada `status`.
        PUT diterima sebagai alias.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KeluhanUpdateInput' }
            example: { status: selesai, tindak_lanjut: 'Menu ayam diganti, batch ditarik, orang tua dihubungi.' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Keluhan' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [Keluhan]
      summary: Hapus lunak keluhan (Admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '204': { description: Dihapus (soft delete) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /keuangan/ringkasan:
    get:
      tags: [Keuangan]
      summary: Ringkasan anggaran per periode (Gambar 16)
      description: |
        Hak R (akuntan, kepala_sppg, admin). Admin wajib `sppg_id`. Periode default = bulan berjalan (WIB).
        anggaran = total pencairan periode; terpakai = total pengeluaran bertanggal di bulan periode;
        sisa = anggaran - terpakai; persen = terpakai/anggaran*100. Status: aman (<80%), peringatan (>=80%),
        habis (=100%), melampaui (>100% atau pengeluaran tanpa pencairan), belum_ada_anggaran.
      parameters:
        - { name: periode, in: query, schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$', examples: ['2026-11'] } }
        - { name: sppg_id, in: query, description: 'Wajib untuk Admin.', schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/RingkasanKeuangan' }
              example:
                data:
                  sppg_id: 1
                  periode: '2026-11'
                  anggaran: 100000000
                  terpakai: 40000000
                  sisa: 60000000
                  persen: 40
                  status: aman
                  jumlah_pencairan: 1
                  jumlah_pengeluaran: 2
                  jumlah_melebihi_anggaran: 0
                  per_kategori:
                    - { kategori: bahan_baku, label: Belanja Bahan, nominal: 30000000, jumlah: 1, persen: 75 }
                    - { kategori: energi, label: 'Energi (Gas/Listrik/Air)', nominal: 10000000, jumlah: 1, persen: 25 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /keuangan/pencairan:
    get:
      tags: [Keuangan]
      summary: Daftar pencairan dana
      description: Hak R (akuntan, kepala_sppg, admin lintas SPPG). Peran lain 403.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - { name: periode, in: query, schema: { type: string, examples: ['2026-11'] } }
        - { name: sppg_id, in: query, description: 'Hanya Admin.', schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/PencairanDana' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    post:
      tags: [Keuangan]
      summary: Catat pencairan dana
      description: |
        Hak C: akuntan (SPPG sendiri). Nominal rupiah bulat > 0. Bukti transfer opsional (multipart `bukti`).
        Pencairan baru menaikkan anggaran periode; penanda peringatan 80%/100% yang tidak lagi berlaku
        dipersenjatai ulang sehingga dapat memicu peringatan lagi.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PencairanDanaInput' }
          multipart/form-data:
            schema: { $ref: '#/components/schemas/PencairanDanaInput' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PencairanDana' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UploadRejected' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /keuangan/pencairan/{id}:
    get:
      tags: [Keuangan]
      summary: Detail pencairan dana
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PencairanDana' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Keuangan]
      summary: Ubah pencairan dana (akuntan)
      description: |
        Field opsional. Ganti bukti: multipart POST dengan `_method=PUT`. PATCH = alias.
        Perubahan nominal/periode menghitung ulang ambang kedua periode.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PencairanDanaInput' }
          multipart/form-data:
            schema: { $ref: '#/components/schemas/PencairanDanaInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PencairanDana' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UploadRejected' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      tags: [Keuangan]
      summary: Hapus lunak pencairan dana (akuntan)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '204': { description: Dihapus (soft delete + audit) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /keuangan/pengeluaran:
    get:
      tags: [Keuangan]
      summary: Daftar pengeluaran operasional
      description: Hak R (akuntan, kepala_sppg, admin lintas SPPG). Peran lain 403.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - { name: periode, in: query, description: 'Bulan tanggal pengeluaran.', schema: { type: string, examples: ['2026-11'] } }
        - { name: kategori, in: query, schema: { $ref: '#/components/schemas/KategoriPengeluaran' } }
        - { name: pemasok_id, in: query, schema: { type: integer } }
        - { name: pencairan_dana_id, in: query, schema: { type: integer } }
        - { name: melebihi_anggaran, in: query, schema: { type: boolean } }
        - { name: sppg_id, in: query, description: 'Hanya Admin.', schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Pengeluaran' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    post:
      tags: [Keuangan]
      summary: Catat pengeluaran operasional
      description: |
        Hak C: akuntan. Nominal rupiah bulat > 0; nota opsional (multipart `nota`, SecureUploadService).
        Keputusan FR-09: pengeluaran yang melebihi sisa anggaran periode tetap DICATAT dan ditandai
        `melebihi_anggaran=true` (config `operasional.keuangan.tolak_melebihi_anggaran=true` -> 422).
        Event sekali per (SPPG, periode): `AnggaranMencapai80` (>=80%), `AnggaranMencapai100` (>=100%),
        `AnggaranMelampaui` (>100%); payload {sppg_id, periode, ambang, anggaran, terpakai, sisa, persen}.
        Ditulis atomik (kunci baris SPPG) sehingga kiriman bersamaan tidak menggandakan event.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PengeluaranInput' }
          multipart/form-data:
            schema: { $ref: '#/components/schemas/PengeluaranInput' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Pengeluaran' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UploadRejected' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /keuangan/pengeluaran/{id}:
    get:
      tags: [Keuangan]
      summary: Detail pengeluaran operasional
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Pengeluaran' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Keuangan]
      summary: Ubah pengeluaran operasional (akuntan)
      description: |
        Field opsional. Ganti nota: multipart POST dengan `_method=PUT`. PATCH = alias.
        Perubahan nominal/tanggal menghitung ulang `melebihi_anggaran`; edit tidak pernah memancarkan ulang
        event ambang yang sudah terkirim. Perubahan nominal tercatat di audit_logs (nilai lama/baru).
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PengeluaranInput' }
          multipart/form-data:
            schema: { $ref: '#/components/schemas/PengeluaranInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Pengeluaran' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UploadRejected' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    delete:
      tags: [Keuangan]
      summary: Hapus lunak pengeluaran operasional (akuntan)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '204': { description: Dihapus (soft delete + audit) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /lampiran:
    post:
      tags: [Lampiran]
      summary: Unggah lampiran gambar ke record modul
      description: |
        Unggahan aman (NFR-06) lewat SecureUploadService. Jenis ditentukan dari ISI berkas (finfo +
        tanda tangan byte + getimagesize); ekstensi dan MIME klien diabaikan; nama berkas klien tidak
        pernah dipakai. Gambar di-encode ulang (EXIF/metadata dibuang, diperkecil ke 1600 px) dan
        disimpan di disk privat `uploads/{sppg_id}/{modul}/{uuid}.{ext}`.
        Hak: `update` pada record induk menurut Policy modulnya (mis. akuntan untuk keuangan-pengeluaran).
        Record induk SPPG lain -> 404. Batas laju unggah: 20/menit per pengguna (429).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/LampiranInput' }
      responses:
        '201':
          description: Tersimpan
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Lampiran' }
              example:
                data: { id: 12, kategori: nota, mime: image/jpeg, ukuran: 183204, sha256: '9f2c...e1', url: /api/v1/lampiran/12, uploaded_by: 7, created_at: '2026-11-20T09:00:00+07:00' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UploadRejected' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /lampiran/{id}:
    get:
      tags: [Lampiran]
      summary: Sajikan berkas lampiran (privat)
      description: |
        Satu-satunya jalan mengakses berkas unggahan (tidak ada URL publik/symlink). Hak `view` pada
        record induk (Policy modul induk); lampiran/induk SPPG lain atau induk terhapus -> 404;
        berkas yang berubah di luar aplikasi (sha256 tidak cocok) -> 404.
        Header: `Content-Type` dari MIME tersimpan, `X-Content-Type-Options: nosniff`,
        `Content-Disposition: inline; filename="lampiran.<ext>"`, `Cache-Control: private, no-store`,
        `Content-Security-Policy: default-src 'none'; sandbox`.
        Mini App: ambil dengan fetch + Authorization lalu tampilkan via URL.createObjectURL(blob).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Isi berkas gambar
          headers:
            Content-Disposition:
              schema: { type: string, examples: ['inline; filename="lampiran.jpg"'] }
            Cache-Control:
              schema: { type: string, examples: ['private, no-store'] }
            X-Content-Type-Options:
              schema: { type: string, examples: [nosniff] }
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /log-produksi:
    get:
      tags: [Log Produksi]
      summary: Daftar log produksi harian
      description: |
        Hak R (admin, kepala_sppg, ahli_gizi, akuntan, staf_gudang, relawan unit dapur). Filter: `q`
        (kendala/kode batch), `jadwal_produksi_id`, `tanggal`/`from`/`to` (tanggal produksi jadwal),
        `sppg_id` (Admin).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - { name: jadwal_produksi_id, in: query, schema: { type: integer } }
        - { name: tanggal, in: query, schema: { type: string, format: date } }
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - { name: sppg_id, in: query, description: 'Hanya dipakai Admin', schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/LogProduksi' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Log Produksi]
      summary: Catat log produksi untuk satu jadwal (satu log per jadwal)
      description: |
        Hak C (relawan unit dapur saja; kepala_sppg tidak memiliki C). Kode batch dibuat otomatis
        (`BATCH-YYYYMMDD-NN`, unik per SPPG). Jadwal tidak boleh dibatalkan atau belum tiba harinya.
        422 bila jadwal sudah memiliki log aktif. Bila log lama dihapus lunak, log dipulihkan (restore)
        dengan kode batch yang sama. `realisasi_porsi` >= 0 dan <= kapasitas harian SPPG; respons memuat
        `selisih_porsi` terhadap target. `foto_path` berupa path relatif (unggah berkas dikerjakan modul unggahan).
        Menerima `ai_draft_id` opsional.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogProduksiInput' }
            example: { jadwal_produksi_id: 12, realisasi_porsi: 980, sisa_makanan_kg: 3.5, waktu_mulai: '03:10', jam_selesai: '08:20', kendala: 'Gas hampir habis' }
      responses:
        '201':
          description: Dibuat (atau dipulihkan)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/LogProduksi' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
