    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Pengguna]
      summary: Detail pengguna
      description: Admin dan Kepala SPPG (SPPG-nya) melihat siapa pun yang berhak; peran lain hanya profil sendiri (R*), pengguna lain 403.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Pengguna' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Pengguna]
      summary: Ubah pengguna (Admin)
      description: |
        Hanya Admin. Perubahan role/unit/sppg_id/is_active mencabut seluruh token aktif pengguna itu.
        Admin tidak dapat menonaktifkan atau mengubah peran akunnya sendiri, dan admin aktif terakhir
        tidak dapat dinonaktifkan/diturunkan (422, field `user`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PenggunaUpdateInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Pengguna' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    patch:
      tags: [Pengguna]
      summary: Ubah sebagian pengguna (Admin)
      description: Sama dengan PUT; semua field opsional.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PenggunaUpdateInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Pengguna' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [Pengguna]
      summary: Hapus lunak pengguna (Admin)
      description: Token pengguna dicabut. Tidak dapat menghapus akun sendiri atau admin aktif terakhir (422, field `user`).
      responses:
        '204': { description: Dihapus }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /pengguna/undangan:
    get:
      tags: [Pengguna]
      summary: Daftar undangan Telegram (Admin)
      description: Token tidak pernah ditampilkan ulang (hanya hash SHA-256 yang disimpan).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - { name: status, in: query, schema: { type: string, enum: [aktif, terpakai, kedaluwarsa, dicabut] } }
        - { name: tipe, in: query, schema: { type: string, enum: [pengguna, pic] } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Undangan' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Pengguna]
      summary: Terbitkan tautan undangan pengguna (Admin)
      description: |
        Kebijakan: hanya Admin (FR-02: Admin yang mendaftarkan pengguna; proposal tidak memberi
        Kepala SPPG hak undang). Dua mode: (a) `user_id` = akun yang sudah dibuat dan belum bertaut
        Telegram; (b) `role` (+ `unit` untuk relawan, + `sppg_id` untuk non-admin) bila akun dibuat
        otomatis saat tautan dipakai. Undangan aktif sebelumnya untuk akun yang sama dicabut.
        Token acak 32 byte (base64url), hanya hash SHA-256 yang disimpan, berlaku 72 jam, sekali pakai.
        `token` dan `deep_link` hanya ada pada respons ini; simpan/kirimkan segera.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UndanganInput' }
            examples:
              akunAda: { value: { user_id: 12 } }
              akunBaru: { value: { role: relawan, unit: distribusi, sppg_id: 1 } }
      responses:
        '201':
          description: Dibuat
          headers:
            Cache-Control: { schema: { type: string }, description: 'no-store' }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/UndanganDibuat' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /pengguna/undangan/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    delete:
      tags: [Pengguna]
      summary: Cabut undangan (Admin)
      description: Menandai undangan dicabut (revoked_at); tautan langsung tidak berlaku. Undangan yang sudah dipakai tidak dapat dicabut (422).
      responses:
        '204': { description: Dicabut }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /rekap-harian:
    get:
      tags: [Rekap Harian]
      summary: Riwayat rekap harian (snapshot)
      description: |
        Hak R (admin, kepala_sppg, ahli_gizi, akuntan). Admin lintas SPPG (filter `sppg_id`); lainnya SPPG-nya.
        Urut tanggal terbaru. Filter from/to memakai kolom `tanggal`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - name: sppg_id
          in: query
          description: Hanya Admin.
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/RekapHarian' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Rekap Harian]
      summary: Susun atau susun ulang rekap satu hari
      description: |
        Hak C (kepala_sppg). Idempoten per (SPPG, tanggal): bila snapshot sudah ada, ringkasannya dihitung
        ulang (butuh hak U) dan respons 200; bila baru, 201. `tanggal` default hari ini (WIB), tidak boleh
        di masa depan. `catatan` yang tidak dikirim mempertahankan catatan lama. `kirim=true` memancarkan
        event `RekapHarianDibuat` (pengiriman bot oleh listener).
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RekapHarianInput' }
            example: { tanggal: '2026-11-02', catatan: 'Hujan deras, distribusi sempat tertunda.' }
      responses:
        '200':
          description: Snapshot diperbarui
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/RekapHarian' }
        '201':
          description: Snapshot dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/RekapHarian' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /rekap-harian/ringkasan:
    get:
      tags: [Rekap Harian]
