        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token Sanctum dari POST /auth/telegram (berlaku 480 menit).
  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
          examples: ['Anda tidak memiliki hak akses untuk tindakan ini.']
    ValidationError:
      type: object
      required: [message, errors]
      properties:
        message:
          type: string
          examples: ['Data yang dikirim tidak valid.']
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          examples:
            - init_data: ['init_data wajib diisi (Telegram.WebApp.initData).']
    PaginationLinks:
      type: object
      properties:
        first: { type: [string, 'null'], format: uri }
        last: { type: [string, 'null'], format: uri }
        prev: { type: [string, 'null'], format: uri }
        next: { type: [string, 'null'], format: uri }
    PaginationMeta:
      type: object
      properties:
        current_page: { type: integer }
        from: { type: [integer, 'null'] }
        last_page: { type: integer }
        path: { type: string }
        per_page: { type: integer, maximum: 100 }
        to: { type: [integer, 'null'] }
        total: { type: integer }
        links:
          type: array
          items:
            type: object
            properties:
              url: { type: [string, 'null'] }
              label: { type: string }
              active: { type: boolean }
    Paginated:
      description: |
        Bentuk daftar berpaginasi (Resource::collection($paginator)). Pakai dengan allOf dan
        timpa `data.items` dengan skema modul.
      type: object
      required: [data, links, meta]
      properties:
        data:
          type: array
          items: {}
        links:
          $ref: '#/components/schemas/PaginationLinks'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    AiDraft:
      type: object
      description: |
        Draf hasil Agen AI (FR-11) untuk prefill formulir Mini App. Data BELUM tersimpan:
        simpan dengan memanggil endpoint modul (POST/PUT) beserta `ai_draft_id` = `uuid`.
        Kolom pada `perlu_dicek` (keyakinan < 0,7 atau gagal validasi) diberi label "Perlu dicek".
      properties:
        uuid: { type: string, format: uuid }
        module: { type: string, description: 'Slug modul config/rbac.php, mis. titik-layanan.', example: titik-layanan }
        module_label: { type: string, example: Titik Layanan }
        action: { type: string, enum: [create, update, delete] }
        target_id: { type: [integer, 'null'], description: 'ID record untuk update/delete.' }
        payload:
          type: object
          additionalProperties: true
          description: 'Nilai kolom form modul (nama field = field Form Request). Untuk update memuat `id`.'
        confidence:
          type: object
          additionalProperties: { type: number, minimum: 0, maximum: 1 }
        perlu_dicek: { type: array, items: { type: string } }
        errors:
          type: object
          additionalProperties: { type: array, items: { type: string } }
          description: 'Hasil validasi dry-run Form Request terkini (kosong = siap disimpan). Hanya di GET detail.'
        status: { type: string, enum: [pending, confirmed, discarded, expired] }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        form: { type: string, description: 'Rute Mini App tujuan, mis. /titik-layanan/baru.', example: /titik-layanan/baru }
      example:
        uuid: 3f6c1d2e-8a4b-4c1d-9e2f-0a1b2c3d4e5f
        module: titik-layanan
        module_label: Titik Layanan
        action: create
        target_id: null
        payload: { nama: SDN 2 Sukamaju, jenis: sekolah, alamat: Jl. Fiktif No. 2, jarak_km: 3.5, jumlah_sasaran: 240, pic_nama: Bu Rina }
        confidence: { nama: 0.95, jenis: 0.9, alamat: 0.0, jarak_km: 0.85, jumlah_sasaran: 0.9, pic_nama: 0.6 }
        perlu_dicek: [alamat, pic_nama]
        errors: {}
        status: pending
        expires_at: '2026-11-02T08:30:00+07:00'
        created_at: '2026-11-02T08:00:00+07:00'
        form: /titik-layanan/baru
    Armada:
      type: object
      properties:
        id: { type: integer }
        sppg_id: { type: integer }
        plat_nomor: { type: string, examples: ['B 1234 XY'] }
        jenis: { type: string }
        kapasitas_box: { type: integer }
        status: { type: string, enum: [tersedia, bertugas, servis] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ArmadaInput:
      type: object
      required: [plat_nomor, jenis]
      properties:
        sppg_id: { type: integer, description: 'Wajib untuk Admin; diabaikan untuk peran lain.' }
        plat_nomor: { type: string, maxLength: 20 }
        jenis: { type: string, maxLength: 50 }
        kapasitas_box: { type: integer, minimum: 0, maximum: 100000, default: 0 }
        status: { type: string, enum: [tersedia, bertugas, servis], default: tersedia }
        ai_draft_id: { type: [string, 'null'], format: uuid }
    Pengemudi:
      type: object
      properties:
        id: { type: integer }
        sppg_id: { type: integer }
        nama: { type: string }
        no_hp: { type: [string, 'null'] }
        no_sim: { type: [string, 'null'], description: 'Hanya untuk peran yang boleh mengubah (Admin, Kepala SPPG); tidak ada di respons peran lain.' }
        sim_berlaku_hingga: { type: [string, 'null'], format: date, description: 'Sama seperti no_sim: disembunyikan dari peran R.' }
        sim_status: { type: [string, 'null'], enum: [berlaku, segera_berakhir, kedaluwarsa, null], description: 'segera_berakhir = <= 30 hari; null bila SIM tidak dicatat.' }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PengemudiInput:
      type: object
      required: [nama]
      properties:
        sppg_id: { type: integer, description: 'Wajib untuk Admin; diabaikan untuk peran lain.' }
        nama: { type: string, maxLength: 255 }
        no_hp: { type: [string, 'null'], maxLength: 30 }
        no_sim: { type: [string, 'null'], maxLength: 30 }
        sim_berlaku_hingga: { type: [string, 'null'], format: date }
        is_active: { type: boolean, default: true }
        ai_draft_id: { type: [string, 'null'], format: uuid }
    Role:
      type: string
      enum: [admin, kepala_sppg, ahli_gizi, akuntan, staf_gudang, relawan]
    RelawanUnit:
      type: [string, 'null']
      enum: [dapur, distribusi, null]
    ModuleSlug:
      type: string
      enum:
        - pengguna
        - notifikasi-perjalanan
        - sppg
        - titik-layanan
        - penerima-manfaat
        - bahan-baku
        - pemasok
        - menu-gizi
        - jadwal
        - log-produksi
        - mutu
        - armada
        - bukti-distribusi
        - keuangan
        - keluhan
        - rekap-harian
    AuthUser:
      type: object
      required: [id, name, role, unit, sppg_id, sppg_name, modules, permissions]
      properties:
        id: { type: integer, examples: [12] }
        name: { type: string, examples: ['Siti Rahayu'] }
        role: { $ref: '#/components/schemas/Role' }
        role_label: { type: string, examples: ['Kepala SPPG'] }
        unit: { $ref: '#/components/schemas/RelawanUnit' }
        sppg_id: { type: [integer, 'null'], description: 'null untuk Admin (lintas SPPG)' }
        sppg_name: { type: [string, 'null'], examples: ['SPPG Sukamaju'] }
        telegram_username: { type: [string, 'null'] }
        last_login_at: { type: [string, 'null'], format: date-time }
        modules:
          type: array
          description: Slug modul yang punya minimal satu hak (untuk menu Mini App).
          items: { $ref: '#/components/schemas/ModuleSlug' }
        permissions:
          type: object
          description: |
