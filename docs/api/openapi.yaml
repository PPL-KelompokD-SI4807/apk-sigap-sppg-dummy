                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/JadwalDistribusi' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Jadwal]
      summary: Buat jadwal distribusi (titik layanan, armada, pengemudi, jam, porsi)
      description: |
        Hak C (kepala_sppg, ahli_gizi, relawan unit distribusi). Status awal `menunggu`. Validasi:
        total porsi distribusi (tidak dibatalkan) <= target porsi produksi (422 `jumlah_porsi`);
        armada dan pengemudi tidak boleh bentrok jam pada tanggal yang sama (422 `armada_id`/`pengemudi_id`;
        jendela = jam_berangkat s.d. jam_rencana_tiba, bila tiba kosong dianggap 60 menit); armada tidak
        boleh berstatus servis; `jam_berangkat` wajib bila armada/pengemudi diisi.
