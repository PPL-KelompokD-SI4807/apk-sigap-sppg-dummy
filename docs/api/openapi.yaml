        created_at: '2026-10-26T08:00:00+07:00'
        updated_at: '2026-10-26T08:00:00+07:00'
    SppgInput:
      type: object
      required: [kode, nama, alamat, kapasitas_porsi_harian]
      properties:
        kode: { type: string, maxLength: 30, description: 'Hanya Admin; diabaikan bila dikirim Kepala SPPG.' }
        nama: { type: string, maxLength: 255 }
        alamat: { type: string, maxLength: 255 }
        mitra_yayasan: { type: [string, 'null'], maxLength: 255 }
        telepon: { type: [string, 'null'], maxLength: 30 }
        kapasitas_porsi_harian: { type: integer, minimum: 1, maximum: 100000 }
        status_operasional: { type: string, enum: [aktif, libur, nonaktif], default: aktif }
        ai_draft_id: { type: [string, 'null'], format: uuid }
    TitikLayanan:
      type: object
      properties:
        id: { type: integer }
        sppg_id: { type: integer }
        nama: { type: string }
        jenis: { type: string, enum: [sekolah, paud, posyandu, lainnya] }
        alamat: { type: string }
        jarak_km: { type: string, description: 'decimal(6,2) sebagai string', examples: ['3.50'] }
        jumlah_sasaran: { type: integer }
        pic_nama: { type: string }
        pic_telepon: { type: [string, 'null'] }
        pic_terhubung: { type: boolean, description: 'PIC sudah menautkan Telegram (chat id tidak diekspos).' }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TitikLayananInput:
      type: object
      required: [nama, jenis, alamat, pic_nama]
      properties:
        sppg_id: { type: integer, description: 'Wajib untuk Admin; diabaikan untuk peran lain.' }
        nama: { type: string, maxLength: 255 }
        jenis: { type: string, enum: [sekolah, paud, posyandu, lainnya] }
        alamat: { type: string, maxLength: 255 }
        jarak_km: { type: number, minimum: 0, maximum: 9999.99, default: 0 }
        jumlah_sasaran: { type: integer, minimum: 0, maximum: 100000, default: 0 }
        pic_nama: { type: string, maxLength: 255 }
        pic_telepon: { type: [string, 'null'], maxLength: 30 }
        is_active: { type: boolean, default: true }
        ai_draft_id: { type: [string, 'null'], format: uuid }
  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      description: Jumlah per halaman (maks 100).
      schema: { type: integer, minimum: 1, maximum: 100, default: 15 }
    Search:
      name: q
      in: query
      description: Kata kunci pencarian (maks 100 karakter).
      schema: { type: string, maxLength: 100 }
    DateFrom:
      name: from
      in: query
      schema: { type: string, format: date }
    DateTo:
      name: to
      in: query
      schema: { type: string, format: date }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        UUID unik per aksi tulis (NFR-07). Pengulangan dengan kunci dan payload sama dalam 24 jam
        mengembalikan respons yang sama (header `Idempotent-Replayed: true`) tanpa membuat data baru.
        Kunci sama dengan payload berbeda -> 422; permintaan kembar yang masih diproses -> 409.
        Respons gagal (non-2xx) tidak disimpan.
      schema: { type: string, format: uuid }
  responses:
    Unauthorized:
      description: Token tidak ada/kedaluwarsa/dicabut, atau initData tidak sah.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: 'Tidak terautentikasi. Silakan buka ulang Mini App.' }
    Forbidden:
      description: Peran tidak memiliki hak (Tabel 5) atau akun nonaktif.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: 'Anda tidak memiliki hak akses untuk tindakan ini.' }
    NotFound:
      description: Data tidak ada atau milik SPPG lain.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: 'Data tidak ditemukan.' }
    ValidationFailed:
      description: Validasi Form Request gagal.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }
    TooManyRequests:
      description: Batas laju terlampaui (API 60/menit per pengguna; login 10/menit per IP).
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: 'Terlalu banyak permintaan. Coba lagi sebentar lagi.' }
    ServerError:
      description: Galat internal (detail tidak pernah dikirim di production).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: 'Terjadi kesalahan pada server.' }
    Conflict:
      description: Permintaan dengan Idempotency-Key sama masih diproses.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: 'Permintaan dengan Idempotency-Key yang sama sedang diproses. Coba lagi sebentar lagi.' }
    UploadRejected:
      description: |
        Validasi gagal, termasuk berkas ditolak: bukan JPEG/PNG/WebP menurut ISI berkas, 0 byte,
        > 5 MB, sisi > 8000 px atau > 30 MP, memuat konten tersembunyi (kode PHP/HTML/skrip/ZIP/PDF),
        atau gagal diproses ulang.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }
          example:
            message: Data yang dikirim tidak valid.
            errors:
              berkas: ['Hanya gambar JPEG, PNG, atau WebP yang diizinkan.']
