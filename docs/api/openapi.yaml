        updated_at: { type: string, format: date-time }
    Sppg:
      type: object
      properties:
        id: { type: integer }
        kode: { type: string }
        nama: { type: string }
        alamat: { type: string }
        mitra_yayasan: { type: [string, 'null'] }
        telepon: { type: [string, 'null'] }
