  /pengguna:
    get:
      tags: [Pengguna]
      summary: Daftar pengguna
      description: |
        Admin: semua pengguna (lintas SPPG). Kepala SPPG: pengguna SPPG-nya (R). Ahli Gizi, Akuntan,
        Staf Gudang, Relawan (R*): daftar hanya berisi profil sendiri. Pengguna terhapus lunak tidak tampil.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - { name: role, in: query, schema: { $ref: '#/components/schemas/Role' } }
        - { name: unit, in: query, schema: { type: string, enum: [dapur, distribusi] } }
        - { name: sppg_id, in: query, description: 'Hanya berpengaruh untuk Admin.', schema: { type: integer } }
        - { name: is_active, in: query, schema: { type: boolean } }
        - { name: status, in: query, description: 'menunggu_telegram = akun dibuat tetapi Telegram belum tertaut.', schema: { type: string, enum: [aktif, nonaktif, menunggu_telegram] } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Pengguna' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      tags: [Pengguna]
      summary: Tambah pengguna (Admin)
      description: |
        Membuat akun tanpa Telegram (status `menunggu_telegram`). Tautkan Telegram lewat
        `POST /pengguna/undangan`. `telegram_id` tidak dapat diisi dari body. Peran admin wajib
        `sppg_id` kosong; peran lain wajib `sppg_id`; peran relawan wajib `unit`.
        Menerima `ai_draft_id` opsional (draf Agen AI milik pengguna, pending) yang ditandai confirmed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PenggunaInput' }
            example: { name: 'Siti Rahayu', role: relawan, unit: dapur, sppg_id: 1, phone: '0812-0000-1234' }
      responses:
        '201':
          description: Dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Pengguna' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
